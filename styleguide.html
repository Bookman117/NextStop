<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextStop 樣式頁</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="sg-base">
/* 樣式頁自己的版面。元件外觀一律來自 index.html：載入時讀它的 <style>，並在隔離的 iframe 裡呼叫它的繪製函式產生 HTML。
   所以這一頁不會和看板漂移；改了 index.html，重新整理這一頁就看到新樣子。設計規則見 DESIGN.md。 */
body.sg{margin:0;padding:24px;background:#d9d9d6;font:14px/1.5 "Geist","Huninn",sans-serif;color:#0d0e10}
.sg h1{font:600 22px/1.2 "Geist","Huninn",sans-serif;margin:0 0 4px}
.sg .lead{margin:0 0 20px;color:#555}
.sg-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.sg-cols{grid-template-columns:1fr}}
.sg-col{background:var(--bg);color:var(--ink);border-radius:16px;padding:18px 16px 24px;display:flex;flex-direction:column;gap:12px}
.sg-col>h2{font:500 11px "Geist Mono",monospace;letter-spacing:1.5px;color:var(--muted);margin:0}
.sg-sec{font:500 11px "Geist Mono",monospace;letter-spacing:1.5px;color:var(--muted);margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.sg-note{font-size:12px;color:var(--muted);margin:-4px 0 0}
.sg-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sg-sw div{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sg-sw i{display:block;height:40px}
.sg-sw b{display:block;font:500 11px "Geist Mono",monospace;padding:6px 8px 0}
.sg-sw span{display:block;font:400 10px "Geist Mono",monospace;color:var(--muted);padding:0 8px 6px}
.sg-type div{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.sg-type code{font:400 10px "Geist Mono",monospace;color:var(--muted);min-width:96px}
.sg-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sg-eta{display:flex;flex-wrap:wrap;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.sg-eta figure{margin:0;display:flex;flex-direction:column;gap:6px}
.sg-eta figcaption{font:400 10px "Geist Mono",monospace;color:var(--muted)}
.sg-map{position:relative;height:150px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.sg-map .bld{position:absolute;background-image:radial-gradient(circle,rgba(var(--dot),.22) 1px,transparent 1.3px);background-size:5px 5px;border-radius:2px}
.sg-map svg{position:absolute;inset:0;width:100%;height:100%}
.sg-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.sg-legend span{display:inline-flex;align-items:center;gap:6px}
#sg-err{color:#c8321e}
</style>
</head>
<body class="sg">
<h1>NextStop 樣式頁</h1>
<p class="lead">左淺右深。所有元件用 <code>index.html</code> 的 CSS 與繪製函式即時產生；設計規則與 token 說明見 <code>DESIGN.md</code>。</p>
<p id="sg-err"></p>
<div class="sg-cols"><div class="sg-col" id="light"><h2>LIGHT</h2></div><div class="sg-col dark" id="dark"><h2>DARK</h2></div></div>
<script>
"use strict";
/* 隔離環境：看板在 iframe 裡跑，但不讀真實的 localStorage、不呼叫 TDX、不載地圖，只借用它的繪製函式 */
function ENV(){
  const mem={};
  Object.defineProperty(window,"localStorage",{value:{getItem:k=>k in mem?mem[k]:null,setItem:(k,v)=>{mem[k]=String(v)},removeItem:k=>{delete mem[k]},clear(){},key:()=>null,length:0},configurable:true});
  Object.defineProperty(navigator,"serviceWorker",{value:{register:()=>Promise.resolve()},configurable:true});
  window.fetch=async()=>new Response("[]",{status:200,headers:{"content-type":"application/json"}});
}
const COLORS=[["bg","--bg"],["surface","--surface"],["ink","--ink"],["muted","--muted"],["line","--line"],["route","--route"],["cell","--cell"],
  ["hot","--hot"],["hot-bg","--hot-bg"],["hot-ink","--hot-ink"],["now","--now"],["soon","--soon"],["map-hot","--map-hot"],["me","--me"]];
const TYPE=[["countdown","trip .n","6<small>分</small>",'font:500 52px/.8 var(--f-num);letter-spacing:-3px'],
  ["countdown-list","eta .n","12",'font:500 24px/1 var(--f-num);letter-spacing:-1.5px'],
  ["route-number","rt","307",'font:600 22px var(--f-num);letter-spacing:-.5px'],
  ["title","h1","出門的車",'font-size:20px'],["body","body","捷運台北車站",'font-size:16px'],["status","say","還有一點時間。",'font-size:13px'],
  ["label","sec","常用路線與站牌",'font:500 11px var(--f-mono);letter-spacing:1.5px;color:var(--muted)'],["micro","k","LIVE · 選取的站",'font:500 10px var(--f-mono);letter-spacing:1.5px;color:var(--muted)']];
(async()=>{
  try{
    const html=await (await fetch("index.html",{cache:"no-store"})).text();
    /* 1. 真正的 CSS：深色區塊改寫成 .dark 底下的規則，讓淺深兩欄並排 */
    const css=(html.match(/<style>([\s\S]*?)<\/style>/)||[])[1]||"";
    /* 用文字處理，不經過 CSSOM：瀏覽器把含 var() 的 font 簡寫讀回來時會整條丟掉。
       找出每個 @media (prefers-color-scheme:dark){…} 區塊（用括號配對），把裡面的選擇器加上 .dark 前綴，原區塊移除 */
    let rest="",dark="",k=0;const re=/@media\s*\(prefers-color-scheme:\s*dark\)\s*\{/g;let m;
    while((m=re.exec(css))){
      rest+=css.slice(k,m.index);let d=1,q=re.lastIndex;
      while(d&&q<css.length){if(css[q]==="{")d++;else if(css[q]==="}")d--;q++}
      const inner=css.slice(re.lastIndex,q-1);
      dark+=inner.replace(/\/\*[\s\S]*?\*\//g,"").replace(/([^{}]+)\{([^{}]*)\}/g,(_,sel,body)=>sel.split(",").map(x=>x.trim()).filter(Boolean).map(x=>x===":root"?".dark":".dark "+x).join(",")+"{"+body+"}\n");
      k=q;re.lastIndex=q;
    }
    rest+=css.slice(k);
    const tmp=document.createElement("style");
    tmp.textContent=rest+"\n"+dark+"\nhtml,body.sg{overflow:auto!important;height:auto!important}body.sg{background:#d9d9d6!important;color:#0d0e10}";
    document.head.appendChild(tmp);   /* 移到最後，讓樣式頁的版面規則以看板 CSS 為準 */
    document.head.appendChild(document.getElementById("sg-base"));
    /* 2. 真正的繪製函式：在隔離的 iframe 裡載入看板 */
    const fr=document.createElement("iframe");fr.style.cssText="position:absolute;width:390px;height:600px;left:-9999px";document.body.appendChild(fr);
    const doc=fr.contentDocument;doc.open();
    doc.write(html.replace("<head>",'<head><base href="'+location.href.replace(/[^/]*$/,"")+'"><script>('+ENV+')()<\/script>').replace(/<script src="https:\/\/unpkg\.com\/maplibre[^>]*><\/script>/,""));
    doc.close();
    const w=fr.contentWindow;
    for(let i=0;i<100&&!(w.eval&&w.eval("typeof tripCard==='function'"));i++)await new Promise(r=>setTimeout(r,50));
    const E=s=>w.eval(s);
    E('S.view="home";S.updated=new Date()');
    const card=(e,hot,route,to,name)=>E("tripCard("+JSON.stringify({tag:"div",cls:"row",e,hot,attrs:"",label:route,head:'<span class="rt">'+route+'</span><span class="to">往 '+to+" · "+name+"</span>"})+")");
    const cards=[["最急的一班（重點色）",card({StopStatus:0,EstimateTime:160},true,"307","撫遠街","捷運西門站")],
      ["一般",card({StopStatus:0,EstimateTime:400},false,"262","民生社區","臺北車站")],
      ["表定",card({StopStatus:1,EstimateTime:720},false,"0東","松山","臺北車站")],
      ["進站中",card({StopStatus:0,EstimateTime:30},false,"紅30","捷運中山站","中正紀念堂")],
      ["末班已過",card({StopStatus:3},false,"604","板橋","臺北車站")]];
    E("S.updated=null;waitUntil=Date.now()+20000");
    cards.push(["等待資料（排隊等配額）",card(undefined,false,"307","撫遠街","捷運西門站")]);
    const etas=[["進站中",{StopStatus:0,EstimateTime:30}],["即將到站",{StopStatus:0,EstimateTime:150}],["即時",{StopStatus:0,EstimateTime:400}],
      ["表定",{StopStatus:1,EstimateTime:720}],["未發車",{StopStatus:1}],["末班已過",{StopStatus:3}],["等待中",null]].map(([t,e])=>{
        E("S.updated="+(e?"new Date()":"null"));return [t,E("etaBox("+(e?JSON.stringify(e):"undefined")+")")]});
    /* 路線列表：用看板的 vRoute() 產生，含路線條、進站中與已離站的車 */
    const stops=["板橋","捷運龍山寺站","和平醫院","捷運西門站","捷運台北車站"].map((n,i)=>({StopUID:"D"+i,StopName:{Zh_tw:n}}));
    E('Object.assign(S,{view:"route",route:{city:"Taipei",name:"307"},dir:0,pick:"D3",updated:new Date(),stops:{0:{RouteUID:"X",Stops:'+JSON.stringify(stops)+'}},'+
      'eta:{"0|D0":{StopStatus:0,EstimateTime:900},"0|D1":{StopStatus:0,EstimateTime:150},"0|D2":{StopStatus:0,EstimateTime:30},"0|D3":{StopStatus:0,EstimateTime:400},"0|D4":{StopStatus:1,EstimateTime:720,IsLastBus:true}},'+
      'near:{"0|D2":[{PlateNumb:"EAL-0158",A2EventType:1}],"0|D0":[{PlateNumb:"EAL-0372",A2EventType:0}]}})');
    const routeList=E("vRoute()").replace(/<div class="seg"[\s\S]*?<\/div>/,"");
    /* 開始使用卡：需要「有金鑰但沒有常用」才會出現（沒金鑰時是示範資料） */
    E('cred={id:"x",secret:"y"};favs=[];S.view="home";S.updated=new Date()');const startCard=E("vHome()");E("cred=null");
    const sk=document.createElement("div");sk.innerHTML=E('skeleton("載入路線中")');[...sk.querySelectorAll(".row")].slice(3).forEach(r=>r.remove());const skel=sk.innerHTML;
    for(const col of [document.getElementById("light"),document.getElementById("dark")]){
      const cs=getComputedStyle(col),v=k=>cs.getPropertyValue(k).trim();
      let h='<div class="sg-sec">色彩（token 名稱對應 DESIGN.md）</div><div class="sg-sw">'+COLORS.map(([n,k])=>'<div><i style="background:var('+k+')"></i><b>'+n+"</b><span>"+v(k)+"</span></div>").join("")+"</div>";
      h+='<div class="sg-sec">字體</div><div class="sg-type">'+TYPE.map(([n,sel,txt,st])=>'<div><code>'+n+'</code><span style="'+st+'">'+txt+"</span></div>").join("")+"</div>";
      h+='<div class="sg-sec">行程卡</div><p class="sg-note">燈條一格＝一分鐘；只有最急的一班用重點色。</p>'+cards.map(([t,c])=>'<div class="sg-note">'+t+"</div>"+c).join("");
      h+='<div class="sg-sec">列表到站牌</div><div class="sg-eta">'+etas.map(([t,b])=>"<figure>"+b+"<figcaption>"+t+"</figcaption></figure>").join("")+"</div>";
      h+='<div class="sg-sec">狀態列（平常三格；排隊等配額時出現第四格）</div>'+
        '<div class="ops"><div class="oc"><span class="k">同步</span><span class="v nextbtn">38 秒</span><span class="prog"><i style="width:63%"></i></span></div><div class="oc"><span class="k">更新</span><span class="v">14:43:30</span></div><div class="oc"><span class="k">在線</span><span class="v"><span class="dotlive"></span>2 台</span></div></div>'+
        '<div class="ops"><div class="oc"><span class="k">同步</span><span class="v">38 秒</span><span class="prog"><i style="width:63%"></i></span></div><div class="oc"><span class="k">更新</span><span class="v">14:43:30</span></div><div class="oc"><span class="k">即時</span><span class="v">2/3 班</span></div><div class="oc oq"><span class="k">配額</span><span class="v">排隊 24 秒</span></div></div>';
      h+='<div class="sg-sec">開始使用（沒有常用時）</div>'+startCard;
      h+='<div class="sg-sec">路線列表與路線條</div><p class="sg-note">選取的站有左側重點色條；車用墨色點，進站中在圓點上、已離站在兩站之間。</p>'+routeList;
      h+='<div class="sg-sec">載入骨架</div>'+skel;
      h+='<div class="sg-sec">控制元件</div><div class="seg"><button aria-pressed="true">往 撫遠街</button><button aria-pressed="false">往 板橋</button></div>'+
        '<div class="search"><input placeholder="例如 307、捷運公館站" aria-label="範例輸入框"><button type="button" class="btn">搜尋</button></div>'+
        '<button type="button" class="btn ghost near-btn">◎ 附近的站牌</button>'+
        '<div class="chips"><button class="chip">307</button><button class="chip">捷運西門</button><button class="chip ghost">清除</button></div>'+
        '<div class="sg-row"><span class="tag">EAL-0158 進站中</span><span class="tag left">EAL-0372 已離站</span><span class="tag last">末班車</span></div>'+
        '<div style="position:relative;height:64px"><div id="toast" class="on" style="position:absolute;bottom:8px"><span>已加入常用 307 捷運西門站</span><button type="button">復原</button></div></div>'+
        '<div class="demo">目前顯示的是示範資料，不是真實到站時間。</div><div class="err">連不上 TDX，下一輪會自動重試。</div>';
      h+='<div class="sg-sec">地圖圖例</div><div class="sg-map"><span class="bld" style="left:8%;top:12%;width:22%;height:30%"></span><span class="bld" style="left:58%;top:55%;width:28%;height:32%"></span>'+
        '<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice"><path d="M10 120 C 90 100,140 60,220 70 S 330 40,390 30" fill="none" stroke="var(--bg)" stroke-width="10" stroke-linecap="round"/>'+
        '<path d="M10 120 C 90 100,140 60,220 70 S 330 40,390 30" fill="none" stroke="var(--route)" stroke-width="5" stroke-linecap="round"/>'+
        '<circle cx="80" cy="104" r="4" fill="var(--bg)" stroke="var(--route)" stroke-width="2"/><circle cx="220" cy="70" r="7" fill="var(--ink)" stroke="var(--bg)" stroke-width="3"/>'+
        '<circle cx="300" cy="50" r="6" fill="var(--ink)" stroke="var(--bg)" stroke-width="2.5"/><circle cx="150" cy="78" r="8" fill="var(--map-hot)" stroke="var(--bg)" stroke-width="3"/>'+
        '<circle cx="120" cy="40" r="14" fill="var(--me)" opacity=".12"/><circle cx="120" cy="40" r="7" fill="var(--me)" stroke="#fff" stroke-width="3"/></svg></div>'+
        '<div class="sg-legend"><span>— 路線（家族色或 route）</span><span>○ 一般站</span><span>● 選取／常用站</span><span style="color:var(--map-hot)">● 公車</span><span style="color:var(--me)">● 我的位置</span></div>';
      col.insertAdjacentHTML("beforeend",h);
    }
    fr.remove();
    document.title="NextStop 樣式頁（已產生）";
  }catch(e){document.getElementById("sg-err").textContent="產生樣式頁失敗："+(e&&e.message||e)}
})();
</script>
</body>
</html>
