<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雙北公車即時看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
/* 版面：單欄手機看板。左側固定寬度的到站時間牌，右側站名與車輛，底部三個分頁。 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14232e; --muted:#5d6f7c; --line:#d5dce2;
  --accent:#0b6e8a; --accent-ink:#ffffff;
  --now:#c8321e; --now-bg:#fde6e1; --soon:#a55b00; --soon-bg:#fff0d6; --ok-bg:#e3eef2; --off-bg:#e9ecef;
  --f-num:"Saira Condensed","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e171d; --surface:#17232b; --ink:#e6edf1; --muted:#93a4b0; --line:#2a3943;
    --accent:#4fb6d1; --accent-ink:#06222b;
    --now:#ff8a75; --now-bg:#4a1c14; --soon:#ffc266; --soon-bg:#45300c; --ok-bg:#1f3640; --off-bg:#222e36;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 0}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar h1{font-size:20px;font-weight:700;margin:0;flex:1;text-wrap:balance}
.bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.back{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:6px 0 4px;font-variant-numeric:tabular-nums}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:100%;transition:width 1s linear}
main{flex:1;padding:12px 16px 96px;display:flex;flex-direction:column;gap:12px}
.demo{background:var(--soon-bg);color:var(--soon);border-radius:10px;padding:10px 12px;font-size:14px}
.demo button{text-decoration:underline;font-weight:700}
.err{background:var(--now-bg);color:var(--now);border-radius:10px;padding:10px 12px;font-size:14px}
.sec{font-size:13px;color:var(--muted);font-weight:500;margin:6px 0 -4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-height:60px;width:100%;text-align:left}
.row:first-child{border-top:0}
.eta{flex:0 0 78px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ok-bg);font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.eta small{font-family:var(--f-body);font-size:10px;font-weight:500;margin-top:2px}
.eta.txt{font-family:var(--f-body);font-size:13px;font-weight:700}
.eta.now{background:var(--now);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.eta.soon{background:var(--soon-bg);color:var(--soon)}
.eta.off{background:var(--off-bg);color:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:500}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.eta.now{animation:none}.prog i{transition:none}}
.body{flex:1;min-width:0}
.body b{display:block;font-weight:500;overflow-wrap:anywhere}
.body span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rt{font-family:var(--f-num);font-size:22px;font-weight:700;letter-spacing:.3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.tag.left{background:var(--off-bg);color:var(--muted)}
.tag.last{background:var(--now-bg);color:var(--now)}
.star{flex:0 0 44px;height:44px;font-size:22px;color:var(--muted);border-radius:10px}
.star.on{color:var(--soon)}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);padding:4px 8px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.search{display:flex;gap:8px}
.search input,.field input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.btn{height:48px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.empty{color:var(--muted);font-size:14px;padding:18px 4px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.card a{color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;min-height:56px;font-size:14px;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
/* .body span 會蓋掉 .tag 的顏色，車牌標籤要用較明確的選擇器 */
.body .tag{display:inline-block;color:var(--accent-ink)}
.body .tag.left{color:var(--muted)}
.body .tag.last{color:var(--now)}

/* ---------- 地圖為主的版面 ----------
   地圖鋪滿整個畫面，列表放在面板裡浮在地圖上。
   手機：底部抽屜，可拖曳或點把手切換三段高度（peek／half／full）。
   桌面（1024px 以上）：左側浮動面板，分頁列移到面板上方。
   Leaflet 沒載入時（離線或 CDN 被擋）加上 .nomap，退回原本的單欄列表。 */
:root{--navh:calc(56px + env(safe-area-inset-bottom))}
html,body{overflow:hidden}
#map{position:fixed;inset:0;z-index:0;background:var(--off-bg)}
/* 底圖用灰階版（EMAP01），再壓低對比，讓路線、站牌與公車浮出來 */
#map .leaflet-tile-pane{filter:contrast(.75) brightness(1.06)}
#map.map-dark .leaflet-tile-pane{filter:invert(1) brightness(.78) contrast(.8)}
#app{position:fixed;left:0;right:0;bottom:var(--navh);height:var(--sheet,52dvh);max-width:none;min-height:0;margin:0;z-index:10;
  background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22);display:flex;flex-direction:column;transition:height .22s ease}
#app.dragging{transition:none}
.grip{display:block;flex:0 0 auto;width:100%;height:22px;touch-action:none;cursor:grab}
.grip::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0}
#app header{position:static;padding-top:0;touch-action:none}
#app main{overflow:auto;overscroll-behavior:contain;padding-bottom:24px}
nav{z-index:20}
.row.pick{cursor:pointer}
.row.sel{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.bus{position:relative}
.bus i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--now);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.bus em{position:absolute;left:12px;top:-10px;white-space:nowrap;font:700 11px/1 var(--f-num);font-style:normal;background:var(--ink);color:var(--bg);padding:3px 5px;border-radius:5px}
.leaflet-tooltip{font:500 12px var(--f-body)}
.leaflet-container{font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){#app{transition:none}}
@media (min-width:1024px){
  nav{left:16px;right:auto;top:16px;bottom:auto;width:408px;border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden}
  nav button{min-height:44px}
  #app{left:16px;right:auto;top:76px;bottom:16px;width:408px;height:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.22)}
  .grip{display:none}
  #app header{padding-top:12px;touch-action:auto}
}
.nomap,.nomap body{overflow:auto}
.nomap #map,.nomap .grip{display:none}
.nomap #app{position:static;height:auto;max-width:520px;margin:0 auto;min-height:100%;border-radius:0;box-shadow:none;border:0;width:auto}
.nomap #app header{position:sticky;padding-top:12px}
.nomap #app main{overflow:visible;padding-bottom:96px}
@media (min-width:1024px){.nomap nav{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:0;border:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="地圖"></div>
<div id="app">
  <button class="grip" id="grip" data-act="sheet" aria-label="調整列表高度"></button>
  <header id="head"></header>
  <main id="main"></main>
</div>
<nav><div>
  <button data-act="tab" data-v="home" id="tab-home">常用</button>
  <button data-act="tab" data-v="search" id="tab-search">搜尋</button>
  <button data-act="tab" data-v="settings" id="tab-settings">設定</button>
</div></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
const BASE="https://tdx.transportdata.tw/api/basic/v2/Bus/";
const TOKEN_URL="https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
const CITIES=[["Taipei","台北"],["NewTaipei","新北"]];
const CITY_NAME=Object.fromEntries(CITIES);
const REFRESH=60;

/* ---------- 本機儲存 ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let cred=store.get("tdx_cred",null);
let favs=store.get("bus_favs",[]);
const isDemo=()=>!cred;

/* ---------- 狀態 ---------- */
const S={view:"home",q:"",results:null,route:null,dir:0,stopName:null,stopPos:[],pick:null,shape:null,sheet:"half",
  home:{},stops:null,eta:{},near:{},board:null,err:"",busy:false,updated:null,left:REFRESH,msg:""};
const stopPosByName={};   // 搜尋結果帶回的站牌座標：站名 -> [[lat,lon],...]
const pos=p=>p&&p.PositionLat&&p.PositionLon?[+p.PositionLat.toFixed(5),+p.PositionLon.toFixed(5)]:null;
// RouteUID -> {dep,dest,name,city}；由 routeList() 的路線清單填入
const routeInfo={};
store.del("route_info");   // 舊版另存的路線起訖站，已改由路線清單提供
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q1=s=>String(s).replace(/'/g,"''");
const zh=o=>(o&&(o.Zh_tw||o.En))||"";

/* ---------- TDX 連線 ---------- */
/* TDX 基礎會員（免費）：每把金鑰每分鐘 5 次；每月 3 點，基礎服務 1,500 次折 1 點，約 4,500 次。
   請求依序排隊，任一 WINDOW 時間內最多 PER_MIN 次。呼叫時間記在 localStorage，同一瀏覽器的分頁共用。
   遇到 429 先停到配額恢復（Retry-After 或一整個視窗），再重試一次。 */
const PER_MIN=5,WINDOW=61000,MONTH_FREE=4500,DAY=864e5;
let chain=Promise.resolve(),waitUntil=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const STALE=new Error("stale");
const monthKey=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)};
function usage(){const u=store.get("tdx_usage",null),m=monthKey();return u&&u.m===m?u:{m,n:0}}
function slotWait(){
  const now=Date.now(),recent=store.get("tdx_calls",[]).filter(t=>now-t<WINDOW);
  let w=Math.max(0,store.get("tdx_block",0)-now);
  if(recent.length>=PER_MIN)w=Math.max(w,recent[recent.length-PER_MIN]+WINDOW-now);
  return w;
}
function markCall(){
  const now=Date.now();
  store.set("tdx_calls",store.get("tdx_calls",[]).filter(t=>now-t<WINDOW).concat(now));
  const u=usage();u.n++;store.set("tdx_usage",u);
}
/* stale()：呼叫端已不需要這筆資料（換頁或下一輪更新開始）時回傳 true，排隊中的請求就不送出，省下配額 */
function queued(fn,stale){
  const run=chain.then(async()=>{
    for(let i=0;;i++){
      for(let w;(w=slotWait())>0;){
        if(stale&&stale())throw STALE;
        if(!(stale&&stale.quiet))waitUntil=Date.now()+w;   // 背景請求（線形）排隊時不顯示等待訊息
        await sleep(Math.min(w,1000));
      }
      waitUntil=0;
      if(stale&&stale())throw STALE;
      markCall();
      const r=await fn();
      if(r.status!==429||i>=1)return r;
      const ra=Number(r.headers.get("retry-after"));
      store.set("tdx_block",Date.now()+(ra>0?ra*1000:WINDOW));
    }
  });
  chain=run.catch(()=>{waitUntil=0});
  return run;
}
/* 站序、路線起訖站這類靜態資料快取在 localStorage，7 天內不重抓 */
function cacheGet(k,ttl){const c=store.get(k,null);return c&&Date.now()-c.t<ttl?c.v:null}
function cacheSet(k,v){store.set(k,{t:Date.now(),v})}
function tfetch(url,opt){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  return fetch(url,Object.assign({signal:c.signal},opt)).finally(()=>clearTimeout(t));
}
async function getToken(force){
  const t=store.get("tdx_tok",null);
  if(!force&&t&&t.exp>Date.now()+60000)return t.v;
  const body=new URLSearchParams({grant_type:"client_credentials",client_id:cred.id,client_secret:cred.secret});
  const r=await tfetch(TOKEN_URL,{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body});
  if(!r.ok){const e=new Error("auth");e.status=401;throw e}
  const j=await r.json();
  store.set("tdx_tok",{v:j.access_token,exp:Date.now()+(j.expires_in||3600)*1000});
  return j.access_token;
}
async function api(path,params,stale,retry){
  if(isDemo())return demoApi(path,params||{});
  const qs=new URLSearchParams(Object.assign({"$format":"JSON"},params||{}));
  const tok=await getToken(retry);
  const r=await queued(()=>tfetch(BASE+path+"?"+qs,{headers:{authorization:"Bearer "+tok}}),stale);
  if(r.status===401&&!retry)return api(path,params,stale,true);
  if(!r.ok){const e=new Error("http");e.status=r.status;throw e}
  return r.json();
}
function errText(e){
  if(e.status===401)return "金鑰驗證失敗。請到「設定」檢查 Client ID 與 Client Secret。";
  if(e.status===429)return "TDX 回應呼叫太頻繁（免費方案每分鐘 5 次），下一輪會自動重試。";
  if(e.status)return "TDX 回應錯誤（HTTP "+e.status+"），下一輪會自動重試。";
  if(e.name==="AbortError")return "連線逾時（12 秒）。請檢查網路後再試。";
  return "連不上 TDX。若你是在聊天室的檔案預覽裡開啟，預覽環境會擋掉對外連線，請改用手機或電腦瀏覽器直接開啟檔案。";
}

/* ---------- 到站時間格式 ---------- */
function fmt(e){
  if(!e)return {cls:"off",text:"無資料"};
  const s=e.StopStatus,t=e.EstimateTime;
  if(t!=null&&t>=0&&(s==null||s===0||s===1)){
    if(t<=60)return {cls:"now txt",text:"進站中"};
    if(t<=180)return {cls:"soon",text:Math.ceil(t/60),sub:"即將到站"};
    return {cls:"",text:Math.round(t/60),sub:"分"};
  }
  if(s===1){
    if(e.NextBusTime){const d=new Date(e.NextBusTime);if(!isNaN(d))return {cls:"off",text:hm(d)+" 發車"}}
    return {cls:"off",text:"尚未發車"};
  }
  if(s===2)return {cls:"off",text:"交管不停靠"};
  if(s===3)return {cls:"off",text:"末班車已過"};
  if(s===4)return {cls:"off",text:"今日未營運"};
  return {cls:"off",text:"尚未發車"};
}
const p2=n=>String(n).padStart(2,"0");
const hm=d=>p2(d.getHours())+":"+p2(d.getMinutes());
const etaBox=e=>{const f=fmt(e);return '<div class="eta '+f.cls+'">'+esc(f.text)+(f.sub?"<small>"+f.sub+"</small>":"")+"</div>"};
const rank=e=>{const t=e&&e.EstimateTime;return (t!=null&&t>=0&&(e.StopStatus==null||e.StopStatus<=1))?t:1e9+((e&&e.StopStatus)||9)};
function better(a,b){return !a||rank(b)<rank(a)?b:a}

/* ---------- 資料載入 ---------- */
async function loadHome(stale){
  const rs=shownFavs().filter(f=>f.type==="rs");
  const out={};
  await Promise.all(CITIES.map(async([c])=>{
    const mine=rs.filter(f=>f.city===c);if(!mine.length)return;
    const filter=[...new Set(mine.map(f=>"StopUID eq '"+q1(f.stopUID)+"'"))].join(" or ");
    const rows=await api("EstimatedTimeOfArrival/City/"+c,{"$filter":filter,"$top":"500"},stale);
    for(const e of rows)for(const f of mine)
      if(e.StopUID===f.stopUID&&e.RouteUID===f.routeUID&&e.Direction===f.dir)out[favId(f)]=better(out[favId(f)],e);
  }));
  S.home=out;
}
async function loadRouteStatic(stale){
  const {city,name}=S.route,key="sor2|"+city+"|"+name;
  let byDir=isDemo()?null:cacheGet(key,7*DAY);
  if(!byDir){
    const rows=await api("StopOfRoute/City/"+city+"/"+encodeURIComponent(name),{"$filter":"RouteName/Zh_tw eq '"+q1(name)+"'"},stale);
    byDir={};
    for(const r of rows){
      if(zh(r.RouteName)!==name)continue;
      const cur=byDir[r.Direction];
      if(!cur||r.Stops.length>cur.Stops.length)
        byDir[r.Direction]={RouteUID:r.RouteUID,Stops:r.Stops.map(s=>({StopUID:s.StopUID,StopName:{Zh_tw:zh(s.StopName)},pos:pos(s.StopPosition)}))};
    }
    if(!isDemo()&&Object.keys(byDir).length)cacheSet(key,byDir);
  }
  S.stops=byDir;
  const dirs=Object.keys(byDir).map(Number).sort();
  if(!dirs.includes(S.dir))S.dir=dirs.length?dirs[0]:0;
}
async function loadRouteLive(stale){
  if(!S.stops)await loadRouteStatic(stale);
  const {city,name}=S.route,p={"$filter":"RouteName/Zh_tw eq '"+q1(name)+"'"};
  const path=city+"/"+encodeURIComponent(name);
  const [eta,near]=await Promise.all([
    api("EstimatedTimeOfArrival/City/"+path,p,stale),
    api("RealTimeNearStop/City/"+path,p,stale).catch(e=>{if(e===STALE)throw e;return []})
  ]);
  const m={},n={};
  for(const e of eta){const k=e.Direction+"|"+e.StopUID;m[k]=better(m[k],e)}
  for(const b of near){const k=b.Direction+"|"+b.StopUID;(n[k]=n[k]||[]).push(b)}
  S.eta=m;S.near=n;
}
/* 路線線形：靜態資料，快取 7 天；在到站資料之後才排隊，拿不到就用站牌連線代替 */
function parseWKT(w){
  return String(w||"").split(/\)\s*,\s*\(/).map(seg=>(seg.match(/-?\d+(?:\.\d+)?\s+-?\d+(?:\.\d+)?/g)||[])
    .map(t=>{const [x,y]=t.trim().split(/\s+/).map(Number);return [+y.toFixed(5),+x.toFixed(5)]})).filter(l=>l.length>1);
}
/* Google encoded polyline（TDX Shape 另一個欄位），Geometry 缺少時用 */
function decodePolyline(str){
  const out=[];let i=0,lat=0,lon=0;
  while(i<str.length){
    for(const k of [0,1]){
      let b,sh=0,res=0;
      do{b=str.charCodeAt(i++)-63;res|=(b&31)<<sh;sh+=5}while(b>=32);
      const d=res&1?~(res>>1):res>>1;
      if(k===0)lat+=d;else lon+=d;
    }
    out.push([+(lat/1e5).toFixed(5),+(lon/1e5).toFixed(5)]);
  }
  return out;
}
async function loadShape(stale){
  const {city,name}=S.route,key="shape|"+city+"|"+name;
  if(isDemo()){S.shape={};return}
  let sh=cacheGet(key,7*DAY);
  if(!sh){
    const rows=await api("Shape/City/"+city+"/"+encodeURIComponent(name),{"$filter":"RouteName/Zh_tw eq '"+q1(name)+"'"},stale);
    sh={};
    for(const r of rows){
      if(zh(r.RouteName)!==name)continue;
      const lines=r.Geometry?parseWKT(r.Geometry):r.EncodedPolyline?[decodePolyline(r.EncodedPolyline)]:[],d=r.Direction==null?"any":r.Direction;
      if(lines.length&&(!sh[d]||lines.flat().length>sh[d].flat().length))sh[d]=lines;
    }
    cacheSet(key,sh);
  }
  S.shape=sh;
}
async function loadStop(stale){
  const name=S.stopName,rows=[];
  await Promise.all(CITIES.map(async([c])=>{
    const list=await api("EstimatedTimeOfArrival/City/"+c,{"$filter":"StopName/Zh_tw eq '"+q1(name)+"'","$top":"500"},stale);
    const best={};
    for(const e of list){if(zh(e.StopName)!==name)continue;const k=e.RouteUID+"|"+e.Direction;best[k]=better(best[k],e)}
    if(Object.values(best).some(e=>!routeInfo[e.RouteUID]))
      await routeList(c,stale).catch(e=>{if(e===STALE)throw e});
    for(const e of Object.values(best))rows.push({e,city:c});
  }));
  rows.sort((a,b)=>rank(a.e)-rank(b.e)||zh(a.e.RouteName).localeCompare(zh(b.e.RouteName),"zh-Hant",{numeric:true}));
  S.board=rows;
}
/* 整個城市的路線清單（名稱與起訖站）快取 7 天：搜尋路線與站牌看板的「往 ○○」都在本機查，不必每次呼叫 TDX。
   一個城市一次呼叫，約 1,000 筆、100 KB 左右。 */
async function routeList(c,stale){
  const key="routes|"+c;
  let v=isDemo()?null:cacheGet(key,7*DAY);
  if(!v){
    const rows=await api("Route/City/"+c,{"$select":"RouteUID,RouteName,DepartureStopNameZh,DestinationStopNameZh","$top":"5000"},stale);
    v=rows.map(r=>[r.RouteUID,zh(r.RouteName),r.DepartureStopNameZh||"",r.DestinationStopNameZh||""]);
    if(!isDemo()&&v.length)cacheSet(key,v);
  }
  for(const [uid,name,dep,dest] of v)routeInfo[uid]={name,dep,dest,city:c};
  return v;
}
async function doSearch(){
  const q=S.q.trim();if(!q){S.results=null;return}
  const stale=()=>S.view!=="search"||S.q.trim()!==q;
  /* 路線在本機清單裡找；只有輸入含中文等非英數字元時才向 TDX 查站牌。
     例如搜尋「262」完全不呼叫 API，搜尋「公館」才花 2 次（台北、新北各一）。 */
  const routes=[],stops=new Set(),wantStops=!/^[0-9A-Za-z\-]+$/.test(q);
  await Promise.all(CITIES.map(async([c])=>{
    const [rs,ss]=await Promise.all([
      routeList(c,stale),
      wantStops?api("Stop/City/"+c,{"$filter":"contains(StopName/Zh_tw,'"+q1(q)+"')","$select":"StopName,StopPosition","$top":"400"},stale):[]
    ]);
    const ql=q.toLowerCase();
    for(const [uid,name,dep,dest] of rs)if(name.toLowerCase().includes(ql))routes.push({uid,name,dep,dest,city:c});
    for(const s of ss){
      const n=zh(s.StopName),p=pos(s.StopPosition);stops.add(n);
      if(p){const a=stopPosByName[n]=stopPosByName[n]||[];if(!a.some(x=>x[0]===p[0]&&x[1]===p[1]))a.push(p)}
    }
  }));
  const seen=new Set();
  S.results={
    routes:routes.filter(r=>!seen.has(r.uid)&&seen.add(r.uid)).sort((a,b)=>a.name.length-b.name.length||a.name.localeCompare(b.name,"zh-Hant",{numeric:true})).slice(0,30),
    stops:[...stops].sort((a,b)=>a.length-b.length||a.localeCompare(b,"zh-Hant")).slice(0,30)
  };
}

let seq=0;
async function refresh(){
  const my=++seq,stale=()=>my!==seq;S.busy=true;S.left=REFRESH;
  try{
    if(S.view==="home")await loadHome(stale);
    else if(S.view==="route")await loadRouteLive(stale);
    else if(S.view==="stop")await loadStop(stale);
    if(my!==seq)return;
    S.err="";S.updated=new Date();
  }catch(e){if(my!==seq)return;S.err=errText(e)}
  S.busy=false;render();
  const bg=()=>stale();bg.quiet=true;
  if(S.view==="route"&&S.stops&&!S.shape&&!S.err)
    loadShape(bg).then(()=>{if(!stale())drawMap()}).catch(e=>{if(e!==STALE&&!stale()){S.shape={};drawMap()}});

const live=()=>S.view==="home"||S.view==="route"||S.view==="stop";

async function doAction(kind){
  if(kind==="search"){
    S.q=$("q").value;S.busy=true;S.err="";render();

    const id=$("cid").value.trim(),secret=$("csec").value.trim();
    if(!id||!secret){S.msg="兩個欄位都要填。";S.msgOk=false;render();return}
    const old=cred;cred={id,secret};store.del("tdx_tok");
    S.msg="測試連線中";S.msgOk=true;render();

      await getToken(true);store.set("tdx_cred",cred);

  }
}

/* ---------- 地圖 ---------- */
/* 底圖：內政部國土測繪中心「臺灣通用電子地圖」WMTS，免金鑰；深色模式用 CSS 反相。
   地圖不另外呼叫 TDX 抓 GPS：公車畫在 RealTimeNearStop 回報的站牌位置上，精度到「站」，不增加每輪更新的呼叫次數。 */
const WIDE=matchMedia("(min-width:1024px)"),DARK=matchMedia("(prefers-color-scheme:dark)"),CALM=matchMedia("(prefers-reduced-motion:reduce)");
let map=null,lay=null,fitKey="";
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function initMap(){
  if(!window.L){document.documentElement.classList.add("nomap");return}
  map=L.map("map",{zoomControl:false,attributionControl:false}).setView([25.04,121.52],12);
  L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP01/default/GoogleMapsCompatible/{z}/{y}/{x}",{maxZoom:19,
    attribution:'<a href="https://maps.nlsc.gov.tw/" target="_blank" rel="noopener">內政部國土測繪中心</a>'}).addTo(map);
  L.control.zoom({position:"topright"}).addTo(map);
  /* 版權標示：手機放左上（下方被抽屜蓋住），桌面放右下（左上被面板蓋住） */
  const attr=L.control.attribution({prefix:'<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>'}).addTo(map);
  const place=()=>attr.setPosition(WIDE.matches?"bottomright":"topleft");place();WIDE.addEventListener("change",place);
  lay=L.layerGroup().addTo(map);
  const dark=()=>$("map").classList.toggle("map-dark",DARK.matches);dark();DARK.addEventListener("change",()=>{dark();drawMap()});
  WIDE.addEventListener("change",()=>{fitKey="";map.invalidateSize();drawMap()});
}
/* 被面板蓋住的區域不算可視範圍 */
function pad(){
  if(WIDE.matches)return {paddingTopLeft:[440,40],paddingBottomRight:[60,40]};
  return {paddingTopLeft:[30,50],paddingBottomRight:[30,$("app").offsetHeight+70]};
}
function fit(key,pts,zoom){
  if(!pts.length||key===fitKey)return;
  fitKey=key;
  if(pts.length===1){map.setView(pts[0],zoom||17,{animate:false});
    const o=pad();map.panBy([((o.paddingTopLeft[0]-o.paddingBottomRight[0])/-2),((o.paddingTopLeft[1]-o.paddingBottomRight[1])/-2)],{animate:false});return}
  map.fitBounds(L.latLngBounds(pts),Object.assign({maxZoom:17,animate:false},pad()));
}
const dot=(p,sel,label,onClick,perm)=>{
  const m=L.circleMarker(p,{radius:sel?9:perm?7:5,weight:2,color:"#fff",fillColor:sel?css("--now"):css("--accent"),fillOpacity:1})
    .bindTooltip(label,{direction:"top",offset:[0,-6],permanent:!!(sel||perm)});
  if(onClick)m.on("click",onClick);
  return m.addTo(lay);
};
function drawMap(){
  if(!map)return;
  lay.clearLayers();
  const v=S.view;
  if(v==="route"&&S.stops&&S.stops[S.dir]){
    const cur=S.stops[S.dir],pts=cur.Stops.filter(s=>s.pos);
    const shape=S.shape&&(S.shape[S.dir]||S.shape.any);
    const lines=shape&&shape.length?shape:[pts.map(s=>s.pos)];
    for(const l of lines)L.polyline(l,{color:css("--accent"),weight:6,opacity:.85,interactive:false}).addTo(lay);
    for(const s of pts)dot(s.pos,S.pick===s.StopUID,esc(zh(s.StopName)),()=>pickStop(s.StopUID,"map"));
    for(const s of pts)for(const b of S.near[S.dir+"|"+s.StopUID]||[])
      L.marker(s.pos,{keyboard:false,icon:L.divIcon({className:"bus",html:"<i></i><em>"+esc(b.PlateNumb)+"</em>",iconSize:[0,0]}),zIndexOffset:500}).addTo(lay);
    const sel=pts.find(s=>s.StopUID===S.pick);
    fit("route|"+S.route.city+"|"+S.route.name+"|"+S.dir,sel?[sel.pos]:pts.map(s=>s.pos),16);
  }else if(v==="stop"){
    for(const p of S.stopPos)dot(p,true,esc(S.stopName));
    fit("stop|"+S.stopName,S.stopPos,17);
  }else if(v==="home"){
    /* 同一個位置可能同時是「路線＋站牌」和「站牌看板」，合併成一個點，標籤分行列出，點下去進第一個 */
    const at={};
    for(const f of shownFavs())for(const p of f.type==="rs"?(f.pos?[f.pos]:[]):(f.pos||[])){
      const k=p.join(",");(at[k]=at[k]||{p,fs:[]}).fs.push(f);
    }
    const open=f=>f.type==="rs"
      ?go("route",{route:{city:f.city,name:f.route},dir:f.dir,stops:null,shape:null,pick:f.stopUID,scrollPick:f.stopUID,eta:{},near:{},prev:"home",updated:null})
      :go("stop",{stopName:f.name,stopPos:f.pos||[],board:null,prev:"home",updated:null});
    for(const {p,fs} of Object.values(at))
      dot(p,false,fs.map(f=>esc(f.type==="rs"?f.route+"　"+f.stopName:f.name+"（站牌）")).join("<br>"),()=>open(fs[0]),true);
    fit("home|"+Object.keys(at).length,Object.values(at).map(x=>x.p));
  }
}
/* 列表與地圖同步選取：點列表移動地圖，點地圖上的站讓列表捲到該站 */
function pickStop(uid,from){
  S.pick=S.pick===uid&&from==="list"?null:uid;
  const cur=S.stops&&S.stops[S.dir],s=cur&&cur.Stops.find(x=>x.StopUID===uid);
  render();
  if(map&&s&&s.pos&&S.pick){
    if(!WIDE.matches&&S.sheet==="full")setSheet("half");
    const o=pad(),z=Math.max(map.getZoom(),15);
    const pt=map.project(s.pos,z).subtract([((o.paddingTopLeft[0]-o.paddingBottomRight[0])/2),((o.paddingTopLeft[1]-o.paddingBottomRight[1])/2)]);
    map.setView(map.unproject(pt,z),z,{animate:!CALM.matches});
  }
  if(from==="map"){
    if(!WIDE.matches&&S.sheet==="peek")setSheet("half");
    const row=document.querySelector('[data-act="pick"][data-uid="'+CSS.escape(uid)+'"]');
    if(row)row.scrollIntoView({block:"center",behavior:CALM.matches?"auto":"smooth"});
  }
}

/* ---------- 手機抽屜 ---------- */
/* 三段高度：peek 只露出標題列、half 約半個畫面、full 幾乎滿版。把手可點按循環，標題列與把手可拖曳。 */
const SHEETS=["peek","half","full"];
let dragEnded=false;   // 拖曳結束時瀏覽器會補一次 click，這段時間內忽略
function sheetPx(k){
  const vh=innerHeight,nav=document.querySelector("nav").offsetHeight;
  if(k==="peek")return 22+$("head").offsetHeight;
  if(k==="full")return vh-nav-56;
  return Math.round(vh*0.52);
}
function setSheet(k){
  S.sheet=k;
  if(WIDE.matches){$("app").style.removeProperty("--sheet");return}
  $("app").style.setProperty("--sheet",sheetPx(k)+"px");
  $("grip").setAttribute("aria-label","調整列表高度（目前："+({peek:"收起",half:"一半",full:"展開"})[k]+"）");
  if(map)setTimeout(()=>map.invalidateSize(),260);
}
function cycleSheet(){setSheet(SHEETS[(SHEETS.indexOf(S.sheet)+1)%3])}
(function(){
  let y0=0,h0=0,moved=false,on=false;
  const app=$("app");
  app.addEventListener("pointerdown",ev=>{
    if(WIDE.matches||!ev.target.closest(".grip,header")||ev.target.closest("header button"))return;
    on=true;moved=false;y0=ev.clientY;h0=app.offsetHeight;app.classList.add("dragging");
  });
  addEventListener("pointermove",ev=>{
    if(!on)return;const dy=ev.clientY-y0;if(Math.abs(dy)>6)moved=true;
    if(moved)app.style.setProperty("--sheet",Math.max(sheetPx("peek"),Math.min(sheetPx("full"),h0-dy))+"px");
  });
  addEventListener("pointerup",ev=>{
    if(!on)return;on=false;app.classList.remove("dragging");
    if(!moved)return;
    const h=app.offsetHeight;let best="half";
    for(const k of SHEETS)if(Math.abs(sheetPx(k)-h)<Math.abs(sheetPx(best)-h))best=k;
    setSheet(best);
    dragEnded=true;setTimeout(()=>{dragEnded=false},80);
  });
})();
addEventListener("resize",()=>{if(!WIDE.matches)setSheet(S.sheet)});

/* ---------- 示範資料（未填金鑰時使用） ---------- */
const DEMO={
  0:["板橋","捷運龍山寺站","和平醫院","捷運西門站","捷運台北車站","南京建國路口","南京敦化路口","撫遠街"],
  1:["撫遠街","南京三民路口","南京敦化路口","南京建國路口","捷運台北車站","捷運西門站","捷運龍山寺站","板橋"]
};
/* 示範站牌的大約座標（只為了畫示範地圖，不是 TDX 資料） */
const DEMO_POS={"板橋":[25.0143,121.4637],"捷運龍山寺站":[25.0353,121.4999],"和平醫院":[25.0359,121.5059],"捷運西門站":[25.0421,121.5081],
  "捷運台北車站":[25.0461,121.5174],"南京建國路口":[25.0521,121.5371],"南京敦化路口":[25.0519,121.5489],"南京三民路口":[25.0517,121.5619],"撫遠街":[25.0527,121.5651]};
const demoPos=n=>({PositionLat:DEMO_POS[n][0],PositionLon:DEMO_POS[n][1]});
function demoApi(path,p){
  const now=Math.floor(Date.now()/1000),f=p["$filter"]||"";
  const route={RouteUID:"DEMO307",RouteName:{Zh_tw:"307"},DepartureStopNameZh:"板橋",DestinationStopNameZh:"撫遠街"};
  const m=/contains\([^,]+,'(.*)'\)/.exec(f),kw=m?m[1]:"";
  if(path.startsWith("Route/"))return path.endsWith("/Taipei")&&(!m||"307".includes(kw))?[route]:[];
  if(path.startsWith("Stop/"))return path.endsWith("/Taipei")?[...new Set(DEMO[0].concat(DEMO[1]))].filter(n=>n.includes(kw)).map(n=>({StopName:{Zh_tw:n},StopPosition:demoPos(n)})):[];
  if(!path.includes("/Taipei"))return [];
  const stops=d=>DEMO[d].map((n,i)=>({StopUID:"D"+d+"-"+i,StopName:{Zh_tw:n},StopSequence:i+1,StopPosition:demoPos(n)}));
  if(path.startsWith("StopOfRoute/"))return [0,1].map(d=>({RouteUID:"DEMO307",RouteName:{Zh_tw:"307"},Direction:d,Stops:stops(d)}));
  const pos=d=>Math.floor(now/45+d*3)%8,sec=45-now%45;
  if(path.startsWith("RealTimeNearStop/"))return [0,1].map(d=>({PlateNumb:d?"EAL-0372":"EAL-0158",Direction:d,StopUID:"D"+d+"-"+pos(d),A2EventType:sec>20?1:0}));
  const sm=/StopName\/Zh_tw eq '(.*)'/.exec(f),out=[];
  for(const d of [0,1])stops(d).forEach((s,i)=>{
    if(sm&&s.StopName.Zh_tw!==sm[1])return;
    const gap=(i-pos(d)+8)%8,last=i===7;
    out.push(Object.assign({RouteUID:"DEMO307",RouteName:{Zh_tw:"307"},Direction:d},s,
      d===1&&i===0?{StopStatus:1,EstimateTime:null}:{StopStatus:0,EstimateTime:gap===0?sec:gap*110+sec,IsLastBus:last&&d===0}));
  });
  return out;
}

initMap();setSheet(S.sheet);render();refresh();
</script>
