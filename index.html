<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雙北公車即時看板</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NextStop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
/* 版面：單欄手機看板。左側固定寬度的到站時間牌，右側站名與車輛，底部三個分頁。
   視覺（2026-11-18，使用者選「P 行程線」）：單色＋唯一的重點色（參考 Braun ET66 只有「＝」是黃色）。
   等寬數字、細線、全大寫小標（參考 Teenage Engineering）；倒數用 10 格燈條表示（參考 Nothing Glyph、Flighty 的進度線）。
   重點色 --hot 只給「最急的那一班」：常用頁最快到的那張卡、路線頁選取的站。 */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --ink:#0d0e10; --muted:#676b71; --line:#e3e3e0; --hair:1px; --raise:#ffffff;
  --accent:#0d0e10; --accent-ink:#ffffff; --route:#5a6068;
  --now:#c8321e; --now-ink:#ffffff; --now-bg:#fff0ec; --soon:#a65300; --soon-bg:#fff6e8; --ok-bg:transparent; --off-bg:#ecece9; --seg-bg:#ebebe8;
  --hot:#ff4d1a; --hot-bg:#0d0e10; --hot-ink:#f4f4f2; --hot-mu:#9a9ea4; --cell:#e6e6e3; --hot-cell:#2a2c30;
  --num:var(--ink);
  --f-num:"Geist Mono",ui-monospace,monospace;
  --f-mono:"Geist Mono",ui-monospace,monospace;
  --f-body:"Geist","Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0c0d; --surface:#151618; --ink:#ecebe6; --muted:#8d9095; --line:#26282b; --raise:#2a2c30;
    --accent:#ecebe6; --accent-ink:#0b0c0d; --route:#9aa0a6;
    --now:#ff5a3c; --now-ink:#2a0400; --now-bg:#2a0f0a; --soon:#ffb020; --soon-bg:#231a08; --off-bg:#1c1d20; --seg-bg:#111214;
    /* 深色時最急的卡反白：淺底深字，重點色改深一階維持對比 */
    --hot:#b92c0c; --hot-bg:#ecebe6; --hot-ink:#0d0e10; --hot-mu:#5c6066; --cell:#26282b; --hot-cell:#d4d3ce;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
/* 中文用 jf 粉圓體（Huninn，OFL，2026-11-18 使用者指定）。它只有一種字重，關掉瀏覽器的假粗體，層級改靠字級與顏色；英數仍是 Geist */
body{font-synthesis-weight:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 0}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar h1{font-size:20px;font-weight:700;margin:0;flex:1;text-wrap:balance}
.bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.back{width:44px;height:44px;border-radius:10px;background:var(--surface);border:var(--hair) solid var(--line);font-size:20px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-family:var(--f-mono);letter-spacing:.2px;color:var(--muted);padding:6px 0 4px;font-variant-numeric:tabular-nums}
.prog{height:1px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);width:100%;transition:width 1s linear}
main{flex:1;padding:12px 16px 96px;display:flex;flex-direction:column;gap:12px}
.demo{background:var(--soon-bg);color:var(--soon);border-radius:10px;padding:10px 12px;font-size:14px}
.demo button{text-decoration:underline;font-weight:700}
.err{background:var(--now-bg);color:var(--now);border-radius:10px;padding:10px 12px;font-size:14px}
.sec{font:500 11px var(--f-mono);letter-spacing:1.5px;color:var(--muted);margin:6px 0 -4px}
.list{background:var(--surface);border:var(--hair) solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:var(--hair) solid var(--line);min-height:58px;width:100%;text-align:left}
.row:first-child{border-top:0}
/* 到站牌：淺色是左側細色條＋等寬數字；深色在後面的 LED 區塊改成點陣面板 */
.eta{flex:0 0 72px;height:44px;border-radius:2px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding-left:11px;background:var(--ok-bg);box-shadow:inset 2px 0 0 var(--line);color:var(--num);font-family:var(--f-num);font-size:25px;font-weight:500;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.eta small{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:1px;margin-top:3px;color:var(--muted)}
.eta.txt{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:0}
/* 進站中：閃爍改用外圈光暈，不動文字與底色的不透明度，對比在動畫中保持不變 */
.eta.now{background:var(--now);color:var(--now-ink);box-shadow:none;border-radius:6px;align-items:center;padding:0;animation:pulse 1.2s ease-in-out infinite}
.eta.now small{color:inherit}
.eta.soon{background:transparent;color:var(--soon);box-shadow:inset 3px 0 0 var(--soon)}
.eta.soon small{color:var(--soon)}
.eta.off{background:var(--off-bg);color:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:500;letter-spacing:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 45%,transparent)}}
@media (prefers-reduced-motion:reduce){.eta.now{animation:none}.prog i{transition:none}}
.body{flex:1;min-width:0}
.body b{display:block;font-weight:500;overflow-wrap:anywhere}
.body span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rt{font-family:var(--f-num);font-size:22px;font-weight:600;letter-spacing:-.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11px;font-weight:600;font-family:var(--f-mono);border-radius:4px;padding:1px 6px;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.tag.left{background:var(--off-bg);color:var(--muted)}
.tag.last{background:var(--now-bg);color:var(--now)}
.star{flex:0 0 44px;height:44px;font-size:22px;color:var(--muted);border-radius:10px}
.star.on{color:var(--soon)}
.seg{display:flex;gap:4px;background:var(--seg-bg);border:var(--hair) solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;min-height:40px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted);padding:4px 8px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 0 0 var(--hair) var(--line),0 1px 2px rgba(0,0,0,.1)}
.search{display:flex;gap:8px}
.search input,.field input{flex:1;min-width:0;height:48px;border-radius:10px;border:var(--hair) solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.btn{height:48px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface);color:var(--ink);border:var(--hair) solid var(--line);font-weight:500}
.empty{color:var(--muted);font-size:14px;padding:18px 4px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:var(--hair) solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.card a{color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:var(--hair) solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;min-height:56px;font-size:14px;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--ink)}
/* .body span 會蓋掉 .tag 的顏色，車牌標籤要用較明確的選擇器 */
.body .tag{display:inline-block;color:var(--accent-ink)}
.body .tag.left{color:var(--muted)}
.body .tag.last{color:var(--now)}

/* ---------- 地圖為主的版面 ----------
   地圖鋪滿整個畫面，列表放在面板裡浮在地圖上。
   手機：底部抽屜，可拖曳或點把手切換三段高度（peek／half／full）。
   桌面（1024px 以上）：左側浮動面板，分頁列移到面板上方。
   Leaflet 沒載入時（離線或 CDN 被擋）加上 .nomap，退回原本的單欄列表。 */
:root{--navh:calc(56px + env(safe-area-inset-bottom))}
html,body{overflow:hidden}
#map{position:fixed;inset:0;z-index:0;background:var(--off-bg)}
/* 底圖用灰階版（EMAP01），再壓低對比，讓路線、站牌與公車浮出來 */
#map .leaflet-tile-pane{filter:contrast(.75) brightness(1.06)}
#map.map-dark .leaflet-tile-pane{filter:invert(1) brightness(.78) contrast(.8)}
#app{position:fixed;left:0;right:0;bottom:var(--navh);height:var(--sheet,52dvh);max-width:none;min-height:0;margin:0;z-index:10;
  background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -1px 0 var(--line),0 -16px 40px rgba(0,0,0,.16);display:flex;flex-direction:column;transition:height .22s ease}
#app.dragging{transition:none}
.grip{display:block;position:relative;flex:0 0 auto;width:100%;height:22px;touch-action:none;cursor:grab}
/* 把手看起來只有 22px，觸控範圍往上延伸到 44px（延伸到地圖邊緣，不壓到標題列的按鈕） */
.grip::after{content:"";position:absolute;left:0;right:0;top:-22px;bottom:0}
.grip::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--muted) 45%,transparent);margin:9px auto 0}
#app header{position:static;padding-top:0;touch-action:none}
#app main{overflow:auto;overscroll-behavior:contain;padding-bottom:24px}
/* main 是 flex 直排；子元素預設會縮小，列表又是 overflow:hidden，會被壓扁裁掉。固定不縮，讓 main 自己捲動 */
#app main>*{flex-shrink:0}
nav{z-index:20}
.row.pick{cursor:pointer}
.row.sel{background:color-mix(in srgb,var(--hot) 8%,transparent);box-shadow:inset 3px 0 0 var(--hot)}
.bus{position:relative}
.bus i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.bus em{position:absolute;left:0;top:13px;transform:translateX(-50%);white-space:nowrap;font:600 11px/1 var(--f-mono);font-style:normal;background:var(--ink);color:var(--bg);padding:3px 5px;border-radius:5px}
.leaflet-tooltip{font:500 12px var(--f-body)}
.leaflet-container{font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){#app{transition:none}}
/* 觸控裝置：地圖按鈕放大到 44px */
@media (pointer:coarse){.leaflet-bar a,.leaflet-bar button{width:44px!important;height:44px!important;line-height:44px!important;font-size:22px!important}}
.locate{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;border:0}
.locate[aria-busy="true"]{opacity:.5}
.me{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2a7bf6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,123,246,.25)}
/* 收起狀態也看得到選取的站 */
.pickline{display:flex;align-items:center;gap:8px;width:100%;margin:6px 0 2px;padding:6px 8px;border-radius:10px;background:var(--surface);border:var(--hair) solid var(--line);font-size:14px;text-align:left;min-height:44px}
.pickline .pill{flex:0 0 auto;min-width:64px;text-align:center;border-radius:5px;padding:3px 6px;font-weight:600;font-size:13px;font-family:var(--f-mono);background:var(--off-bg)}
.pickline .pill.soon{background:var(--soon-bg);color:var(--soon)}
.pickline .pill.now{background:var(--now);color:var(--now-ink)}
.pickline .pill.off{background:var(--off-bg);color:var(--muted);font-weight:500}
.pickline b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.near-btn{width:100%}
.dist{flex:0 0 auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 即時與表定：即時預估在右上角加訊號圖示；表定（還沒發車、照時刻表推算）用虛線框，字樣寫「表定」 */
.eta{position:relative}
.eta .live{position:absolute;top:3px;right:4px;width:11px;height:11px;opacity:.85}
.eta.sched{background:transparent;border:1.5px dashed var(--line);color:var(--ink)}
.eta.sched small{color:var(--muted)}
.pickline .pill.sched{background:transparent;border:1.5px dashed var(--line)}
/* 常用分組 */
.homebar{display:flex;align-items:center;gap:8px}
.homebar .seg{flex:1}
.edit-btn{flex:0 0 auto;min-height:48px;padding:0 14px;border-radius:10px;border:var(--hair) solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.edit-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
/* 編輯列：名稱獨佔一行，分組按鈕與移除鍵放在下一行，窄螢幕也不會把名稱擠成好幾行 */
.erow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-top:var(--hair) solid var(--line)}
.erow:first-child{border-top:0}
.erow .body{flex:1 1 100%;min-width:0}
.gpick{display:flex;gap:4px;flex:1}
.gpick button{flex:1;min-height:44px;min-width:44px;padding:0 8px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.gpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rm{flex:0 0 44px;height:44px;border-radius:10px;color:var(--now);font-size:20px}
.hint{font-size:13px;color:var(--muted)}
/* 路線條（參考 Bus+）：每列左側一段直線串起整條路線，站是圓點；
   公車「進站中」畫在該站圓點上，「已離站」畫在這一站與下一站之間（列的下緣）。 */
.strip{position:relative;flex:0 0 14px;align-self:stretch;margin:-10px 0 -10px -4px}
.strip .ln{position:absolute;left:6px;width:2px;top:0;bottom:0;border-radius:2px;background:var(--rc,var(--route))}
.strip.first .ln{top:50%}.strip.last .ln{bottom:50%}
.strip .st{position:absolute;left:2px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface);border:2px solid var(--rc,var(--route))}
.row.sel .strip .st{background:var(--rc,var(--route))}
/* 公車用文字色（深色模式白、淺色模式深），不用紅色：紅色路線的線條也是紅的，會分不出車 */
.strip .bus{position:absolute;left:-2px;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.strip .bus.at{top:50%;margin-top:-9px}
.strip .bus.gone{bottom:0;margin-bottom:-9px}
@media (min-width:1024px){
  nav{left:16px;right:auto;top:16px;bottom:auto;width:408px;border:var(--hair) solid var(--line);border-radius:12px;padding:0;overflow:hidden}
  nav button{min-height:44px}
  #app{left:16px;right:auto;top:76px;bottom:16px;width:408px;height:auto;border-radius:14px;border:var(--hair) solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .grip{display:none}
  #app header{padding-top:12px;touch-action:auto}
}
/* 地圖按鈕跟面板同一套材質 */
.leaflet-bar{border:var(--hair) solid var(--line)!important;border-radius:10px!important;box-shadow:0 2px 10px rgba(0,0,0,.12)!important;overflow:hidden}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--surface);color:var(--ink);border-bottom-color:var(--line)}
.bar h1{letter-spacing:-.2px}
/* 路線頁標題是路線號，用數字字型；副標維持內文字型 */
.bar h1.route-h{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-1px;color:var(--num)}
.bar h1.route-h small{font-family:var(--f-body);font-weight:400;letter-spacing:0;color:var(--muted);text-shadow:none}
/* ---------- 行程卡（常用頁與路線頁選取的站） ----------
   10 格燈條＝10 分鐘，車越近亮的格子越少；超過 10 分鐘全亮。最急的一張 .hot 反色並用唯一的重點色 */
.trips{display:flex;flex-direction:column;gap:10px}
.trip{display:block;width:100%;text-align:left;background:var(--surface);border:var(--hair) solid var(--line);border-radius:18px;padding:15px 16px 13px;color:var(--ink)}
.trip-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.trip-h>span:first-child{min-width:0}
.trip .rt{display:block;font-size:22px;line-height:1}
.trip .to{display:block;font-size:12px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip .n{flex:0 0 auto;font:500 52px/.8 var(--f-num);letter-spacing:-3px;font-variant-numeric:tabular-nums}
.trip .n small{font:500 12px var(--f-body);letter-spacing:0;margin-left:3px;color:var(--muted)}
.trip .n.txt{font:700 15px/1.2 var(--f-body);letter-spacing:0;padding-top:4px}
.trip .n.now{background:var(--now);color:var(--now-ink);border-radius:8px;padding:8px 10px;animation:pulse 1.2s ease-in-out infinite}
.trip .n.sched{color:var(--muted)}
.cells{display:flex;gap:3px;align-items:center;margin:15px 0 10px}
.cells i{flex:1;height:6px;border-radius:1px;background:var(--cell)}
.cells i.on{background:var(--ink)}
.cells b{flex:0 0 10px;width:10px;height:10px;margin-left:4px;border-radius:50%;border:2px solid currentColor}
.trip.sched .cells i.on{background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 5px)}
.trip.off{opacity:.62}.trip.off .cells{opacity:.5}
.say{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.say em{flex:0 0 auto;font:500 10px var(--f-mono);font-style:normal;letter-spacing:1.5px;color:var(--muted)}
.trip.hot{background:var(--hot-bg);color:var(--hot-ink);border-color:var(--hot-bg)}
.trip.hot .to,.trip.hot .say em,.trip.hot .n small{color:var(--hot-mu)}
.trip.hot .n:not(.now){color:var(--hot)}
.trip.hot .cells i{background:var(--hot-cell)}.trip.hot .cells i.on{background:var(--hot)}
.trip.hot .rt{color:inherit!important}

<body>
<div id="app">
  <button class="grip" id="grip" data-act="sheet" aria-label="調整列表高度"></button>
  <header id="head"></header>

</div>
<nav><div>

  <button data-act="tab" data-v="search" id="tab-search">搜尋</button>
  <button data-act="tab" data-v="settings" id="tab-settings">設定</button>
</div></nav>
<div id="map" role="region" aria-label="地圖"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
const BASE="https://tdx.transportdata.tw/api/basic/v2/Bus/";
const TOKEN_URL="https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
const CITIES=[["Taipei","台北"],["NewTaipei","新北"]];
const CITY_NAME=Object.fromEntries(CITIES);
const REFRESH=60;

/* ---------- 本機儲存 ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let cred=store.get("tdx_cred",null);
let favs=store.get("bus_favs",[]);
const isDemo=()=>!cred;

/* ---------- 狀態 ---------- */
const S={view:"home",q:"",results:null,route:null,dir:0,stopName:null,stopPos:[],pick:null,shape:null,sheet:"half",homeTab:null,editFav:false,
  home:{},stops:null,eta:{},near:{},board:null,err:"",busy:false,updated:null,left:REFRESH,msg:""};
const stopPosByName={};   // 搜尋結果帶回的站牌座標：站名 -> [[lat,lon],...]
const pos=p=>p&&p.PositionLat&&p.PositionLon?[+p.PositionLat.toFixed(5),+p.PositionLon.toFixed(5)]:null;
// RouteUID -> {dep,dest,name,city}；由 routeList() 的路線清單填入
const routeInfo={};
store.del("route_info");   // 舊版另存的路線起訖站，已改由路線清單提供
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q1=s=>String(s).replace(/'/g,"''");
const zh=o=>(o&&(o.Zh_tw||o.En))||"";

/* ---------- TDX 連線 ---------- */
/* TDX 基礎會員（免費）：每把金鑰每分鐘 5 次；每月 3 點，基礎服務 1,500 次折 1 點，約 4,500 次。
   請求依序排隊，任一 WINDOW 時間內最多 PER_MIN 次。呼叫時間記在 localStorage，同一瀏覽器的分頁共用。
   遇到 429 先停到配額恢復（Retry-After 或一整個視窗），再重試一次。 */
const PER_MIN=5,WINDOW=61000,MONTH_FREE=4500,DAY=864e5;
let chain=Promise.resolve(),waitUntil=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const STALE=new Error("stale");
const monthKey=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)};
function usage(){const u=store.get("tdx_usage",null),m=monthKey();return u&&u.m===m?u:{m,n:0}}
function slotWait(){
  const now=Date.now(),recent=store.get("tdx_calls",[]).filter(t=>now-t<WINDOW);
  let w=Math.max(0,store.get("tdx_block",0)-now);
  if(recent.length>=PER_MIN)w=Math.max(w,recent[recent.length-PER_MIN]+WINDOW-now);
  return w;
}
function markCall(){
  const now=Date.now();
  store.set("tdx_calls",store.get("tdx_calls",[]).filter(t=>now-t<WINDOW).concat(now));
  const u=usage();u.n++;store.set("tdx_usage",u);
}
/* stale()：呼叫端已不需要這筆資料（換頁或下一輪更新開始）時回傳 true，排隊中的請求就不送出，省下配額 */
function queued(fn,stale){
  const run=chain.then(async()=>{
    for(let i=0;;i++){
      for(let w;(w=slotWait())>0;){
        if(stale&&stale())throw STALE;
        if(!(stale&&stale.quiet))waitUntil=Date.now()+w;   // 背景請求（線形）排隊時不顯示等待訊息
        await sleep(Math.min(w,1000));
      }
      waitUntil=0;
      if(stale&&stale())throw STALE;
      markCall();
      const r=await fn();
      if(r.status!==429||i>=1)return r;
      const ra=Number(r.headers.get("retry-after"));
      store.set("tdx_block",Date.now()+(ra>0?ra*1000:WINDOW));
    }
  });
  chain=run.catch(()=>{waitUntil=0});
  return run;
}
/* 站序、路線起訖站這類靜態資料快取在 localStorage，7 天內不重抓 */
function cacheGet(k,ttl){const c=store.get(k,null);return c&&Date.now()-c.t<ttl?c.v:null}
function cacheSet(k,v){store.set(k,{t:Date.now(),v})}
function tfetch(url,opt){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  return fetch(url,Object.assign({signal:c.signal},opt)).finally(()=>clearTimeout(t));
}
async function getToken(force){
  const t=store.get("tdx_tok",null);
  if(!force&&t&&t.exp>Date.now()+60000)return t.v;
  const body=new URLSearchParams({grant_type:"client_credentials",client_id:cred.id,client_secret:cred.secret});
  const r=await tfetch(TOKEN_URL,{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body});
  if(!r.ok){const e=new Error("auth");e.status=401;throw e}
  const j=await r.json();
  store.set("tdx_tok",{v:j.access_token,exp:Date.now()+(j.expires_in||3600)*1000});
  return j.access_token;
}
async function api(path,params,stale,retry){
  if(isDemo())return demoApi(path,params||{});
  const qs=new URLSearchParams(Object.assign({"$format":"JSON"},params||{}));
  const tok=await getToken(retry);
  const r=await queued(()=>tfetch(BASE+path+"?"+qs,{headers:{authorization:"Bearer "+tok}}),stale);
  if(r.status===401&&!retry)return api(path,params,stale,true);
  if(!r.ok){const e=new Error("http");e.status=r.status;throw e}
  return r.json();
}
function errText(e){
  if(e.status===401)return "金鑰驗證失敗。請到「設定」檢查 Client ID 與 Client Secret。";
  if(e.status===429)return "TDX 回應呼叫太頻繁（免費方案每分鐘 5 次），下一輪會自動重試。";
  if(e.status)return "TDX 回應錯誤（HTTP "+e.status+"），下一輪會自動重試。";
  if(e.name==="AbortError")return "連線逾時（12 秒）。請檢查網路後再試。";
  if(!navigator.onLine)return "目前離線，看不到即時到站時間。恢復連線後會自動更新。";
  return "連不上 TDX。若你是在聊天室的檔案預覽裡開啟，預覽環境會擋掉對外連線，請改用手機或電腦瀏覽器直接開啟檔案。";
}

/* ---------- 到站時間格式 ---------- */
/* TDX 的 StopStatus：0 表示車已發車、EstimateTime 是即時預估；1 表示尚未發車，此時若有 EstimateTime，是照時刻表推算的。
   兩者可靠程度不同，畫面上分開標示：即時加訊號圖示，表定用虛線框並寫「表定」。 */
function fmt(e){
  if(!e)return {cls:"off",text:"無資料"};
  const s=e.StopStatus,t=e.EstimateTime;
  if(t!=null&&t>=0&&s===1)return {cls:"sched",text:Math.round(t/60),sub:"表定",live:false};
  if(t!=null&&t>=0&&(s==null||s===0)){
    if(t<=60)return {cls:"now txt",text:"進站中",live:true};
    if(t<=180)return {cls:"soon",text:Math.ceil(t/60),sub:"即將到站",live:true};
    return {cls:"",text:Math.round(t/60),sub:"分",live:true};
  }
  if(s===1){
    if(e.NextBusTime){const d=new Date(e.NextBusTime);if(!isNaN(d))return {cls:"off",text:hm(d)+" 發車"}}
    return {cls:"off",text:"尚未發車"};
  }
  if(s===2)return {cls:"off",text:"交管不停靠"};
  if(s===3)return {cls:"off",text:"末班車已過"};
  if(s===4)return {cls:"off",text:"今日未營運"};
  return {cls:"off",text:"尚未發車"};
}
const p2=n=>String(n).padStart(2,"0");
const hm=d=>p2(d.getHours())+":"+p2(d.getMinutes());
/* 路線家族配色（參考 Transit 的路線色）：台北的紅、藍、棕、綠、橘、小字頭路線用對應顏色，數字路線維持主色。
   每個顏色在淺色與深色背景上的文字對比都在 4.5:1 以上。 */
const FAM=[[/^紅/,"#c62f25","#ff7b70"],[/^藍/,"#1f5fc8","#7fabff"],[/^棕/,"#8a5426","#d9a06e"],[/^綠/,"#1f7a3c","#6fd08c"],[/^橘/,"#b0520f","#ffa457"],[/^小/,"#6a4cc0","#b9a2ff"]];
function famColor(name){
  const m=FAM.find(f=>f[0].test(String(name||"")));
  return m?m[matchMedia("(prefers-color-scheme:dark)").matches?2:1]:null;
}
const rcStyle=name=>{const c=famColor(name);return c?' style="--rc:'+c+';color:'+c+'"':""};
const LIVE_ICON='<svg class="live" viewBox="0 0 12 12" aria-hidden="true"><circle cx="2" cy="10" r="1.6" fill="currentColor"/><path d="M2 6.2a3.8 3.8 0 0 1 3.8 3.8M2 2.4A7.6 7.6 0 0 1 9.6 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const etaLabel=f=>f.live?"即時預估：":f.cls==="sched"?"表定推算：":"";
const etaBox=e=>{const f=fmt(e);
  const label=etaLabel(f)+f.text+(f.sub==="分"||f.sub==="表定"?" 分鐘":f.sub?"，"+f.sub:"");
  return '<div class="eta '+f.cls+'" role="img" aria-label="'+esc(label)+'">'+(f.live?LIVE_ICON:"")+esc(f.text)+(f.sub?"<small>"+f.sub+"</small>":"")+"</div>"};
const rank=e=>{const t=e&&e.EstimateTime;return (t!=null&&t>=0&&(e.StopStatus==null||e.StopStatus<=1))?t:1e9+((e&&e.StopStatus)||9)};
function better(a,b){return !a||rank(b)<rank(a)?b:a}
/* 有倒數（即時或表定）時回傳分鐘數，否則 null；雷達與時間比例路線用 */
const etaMin=e=>{const t=e&&e.EstimateTime;return t!=null&&t>=0&&(e.StopStatus==null||e.StopStatus<=1)?t/60:null};
/* 行程卡：一句話狀態只依到站分鐘分級（沒有步行時間資料，不猜「何時出門」） */
function tripSay(f,m){
  if(f.cls.startsWith("now"))return "進站中，車就在站上。";
  if(f.cls==="sched")return "還沒發車，照時刻表推算。";
  if(m==null)return f.text+"。";
  if(m<=3)return "快到了，準備上車。";
  if(m<=8)return "還有一點時間。";
  return "還早，可以慢慢來。";
}
const cells=m=>{const on=m==null?0:Math.min(10,Math.max(0,Math.ceil(m-0.01)));let h='<span class="cells" aria-hidden="true">';for(let i=0;i<10;i++)h+='<i'+(i<on?' class="on"':"")+"></i>";return h+"<b></b></span>"};
function tripCard(o){
  const f=fmt(o.e),m=etaMin(o.e),num=typeof f.text==="number",cls=f.cls.split(" ")[0];
  const big=num?'<span class="n'+(cls==="sched"?" sched":"")+'">'+f.text+"<small>分</small></span>":'<span class="n txt'+(cls==="now"?" now":"")+'">'+esc(f.text)+"</span>";
  const badge=[f.live?"LIVE":cls==="sched"?"表定":"",o.e&&o.e.IsLastBus?"末班車":""].filter(Boolean).join(" · ");
  const label=o.label+"，"+etaLabel(f)+f.text+(num?" 分鐘":"")+(o.e&&o.e.IsLastBus?"，末班車":"");
  return '<'+o.tag+' class="'+o.cls+" trip"+(o.hot?" hot":"")+(cls==="sched"||cls==="off"?" "+cls:"")+'" '+o.attrs+' aria-label="'+esc(label)+'">'+
    '<span class="trip-h"><span>'+o.head+"</span>"+big+"</span>"+cells(f.cls==="off"?null:m)+
    '<span class="say"><span>'+esc(tripSay(f,m))+"</span><em>"+esc(badge)+"</em></span></"+o.tag+">";
}
/* ---------- 資料載入 ---------- */
async function loadHome(stale){
  const rs=shownFavs().filter(f=>f.type==="rs");
  const out={};
  await Promise.all(CITIES.map(async([c])=>{
    const mine=rs.filter(f=>f.city===c);if(!mine.length)return;
    const filter=[...new Set(mine.map(f=>"StopUID eq '"+q1(f.stopUID)+"'"))].join(" or ");
    const rows=await api("EstimatedTimeOfArrival/City/"+c,{"$filter":filter,"$top":"500"},stale);
    for(const e of rows)for(const f of mine)
      if(e.StopUID===f.stopUID&&e.RouteUID===f.routeUID&&e.Direction===f.dir)out[favId(f)]=better(out[favId(f)],e);
  }));
  S.home=out;
}
async function loadRouteStatic(stale){
  const {city,name}=S.route,key="sor2|"+city+"|"+name;
  let byDir=isDemo()?null:cacheGet(key,7*DAY);
  if(!byDir){
    const rows=await api("StopOfRoute/City/"+city+"/"+encodeURIComponent(name),{"$filter":"RouteName/Zh_tw eq '"+q1(name)+"'"},stale);
    byDir={};
    for(const r of rows){
      if(zh(r.RouteName)!==name)continue;
      const cur=byDir[r.Direction];
      if(!cur||r.Stops.length>cur.Stops.length)
        byDir[r.Direction]={RouteUID:r.RouteUID,Stops:r.Stops.map(s=>({StopUID:s.StopUID,StopName:{Zh_tw:zh(s.StopName)},pos:pos(s.StopPosition)}))};
    }
    if(!isDemo()&&Object.keys(byDir).length)cacheSet(key,byDir);
  }
  S.stops=byDir;
  if(!isDemo())backfillFromRoute(city,name,byDir);
  const dirs=Object.keys(byDir).map(Number).sort();
  if(!dirs.includes(S.dir))S.dir=dirs.length?dirs[0]:0;
}
async function loadRouteLive(stale){
  if(!S.stops)await loadRouteStatic(stale);
  const {city,name}=S.route,p={"$filter":"RouteName/Zh_tw eq '"+q1(name)+"'"};
  const path=city+"/"+encodeURIComponent(name);
  const [eta,near]=await Promise.all([
    api("EstimatedTimeOfArrival/City/"+path,p,stale),
    api("RealTimeNearStop/City/"+path,p,stale).catch(e=>{if(e===STALE)throw e;return []})
  ]);
  const m={},n={};
  for(const e of eta){const k=e.Direction+"|"+e.StopUID;m[k]=better(m[k],e)}
  for(const b of near){const k=b.Direction+"|"+b.StopUID;(n[k]=n[k]||[]).push(b)}
  S.eta=m;S.near=n;
}
/* 路線線形：靜態資料，快取 7 天；在到站資料之後才排隊，拿不到就用站牌連線代替 */
function parseWKT(w){
  return String(w||"").split(/\)\s*,\s*\(/).map(seg=>(seg.match(/-?\d+(?:\.\d+)?\s+-?\d+(?:\.\d+)?/g)||[])
    .map(t=>{const [x,y]=t.trim().split(/\s+/).map(Number);return [+y.toFixed(5),+x.toFixed(5)]})).filter(l=>l.length>1);
}
/* Google encoded polyline（TDX Shape 另一個欄位），Geometry 缺少時用 */
function decodePolyline(str){
  const out=[];let i=0,lat=0,lon=0;
  while(i<str.length){
    for(const k of [0,1]){
      let b,sh=0,res=0;
      do{b=str.charCodeAt(i++)-63;res|=(b&31)<<sh;sh+=5}while(b>=32);
      const d=res&1?~(res>>1):res>>1;
      if(k===0)lat+=d;else lon+=d;
    }
    out.push([+(lat/1e5).toFixed(5),+(lon/1e5).toFixed(5)]);
  }
  return out;
}
async function loadShape(stale){
  const {city,name}=S.route,key="shape|"+city+"|"+name;
  if(isDemo()){S.shape={};return}
  let sh=cacheGet(key,7*DAY);
  if(!sh){
    const rows=await api("Shape/City/"+city+"/"+encodeURIComponent(name),{"$filter":"RouteName/Zh_tw eq '"+q1(name)+"'"},stale);
    sh={};
    for(const r of rows){
      if(zh(r.RouteName)!==name)continue;
      const lines=r.Geometry?parseWKT(r.Geometry):r.EncodedPolyline?[decodePolyline(r.EncodedPolyline)]:[],d=r.Direction==null?"any":r.Direction;
      if(lines.length&&(!sh[d]||lines.flat().length>sh[d].flat().length))sh[d]=lines;
    }
    cacheSet(key,sh);
  }
  S.shape=sh;
}
async function loadStop(stale){
  const name=S.stopName,rows=[];
  await Promise.all(CITIES.map(async([c])=>{
    const list=await api("EstimatedTimeOfArrival/City/"+c,{"$filter":"StopName/Zh_tw eq '"+q1(name)+"'","$top":"500"},stale);
    const best={};
    for(const e of list){if(zh(e.StopName)!==name)continue;const k=e.RouteUID+"|"+e.Direction;best[k]=better(best[k],e)}
    if(Object.values(best).some(e=>!routeInfo[e.RouteUID]))
      await routeList(c,stale).catch(e=>{if(e===STALE)throw e});
    for(const e of Object.values(best))rows.push({e,city:c});
  }));
  rows.sort((a,b)=>rank(a.e)-rank(b.e)||zh(a.e.RouteName).localeCompare(zh(b.e.RouteName),"zh-Hant",{numeric:true}));
  S.board=rows;
}
/* 整個城市的路線清單（名稱與起訖站）快取 7 天：搜尋路線與站牌看板的「往 ○○」都在本機查，不必每次呼叫 TDX。
   一個城市一次呼叫，約 1,000 筆、100 KB 左右。 */
async function routeList(c,stale){
  const key="routes|"+c;
  let v=isDemo()?null:cacheGet(key,7*DAY);
  if(!v){
    const rows=await api("Route/City/"+c,{"$select":"RouteUID,RouteName,DepartureStopNameZh,DestinationStopNameZh","$top":"5000"},stale);
    v=rows.map(r=>[r.RouteUID,zh(r.RouteName),r.DepartureStopNameZh||"",r.DestinationStopNameZh||""]);
    if(!isDemo()&&v.length)cacheSet(key,v);
  }
  for(const [uid,name,dep,dest] of v)routeInfo[uid]={name,dep,dest,city:c};
  return v;
}
async function doSearch(){
  const q=S.q.trim();if(!q){S.results=null;return}
  const stale=()=>S.view!=="search"||S.q.trim()!==q;
  /* 路線在本機清單裡找；只有輸入含中文等非英數字元時才向 TDX 查站牌。
     例如搜尋「262」完全不呼叫 API，搜尋「公館」才花 2 次（台北、新北各一）。 */
  const routes=[],stops=new Set(),wantStops=!/^[0-9A-Za-z\-]+$/.test(q);
  await Promise.all(CITIES.map(async([c])=>{
    const [rs,ss]=await Promise.all([
      routeList(c,stale),
      wantStops?api("Stop/City/"+c,{"$filter":"contains(StopName/Zh_tw,'"+q1(q)+"')","$select":"StopName,StopPosition","$top":"400"},stale):[]
    ]);
    const ql=q.toLowerCase();
    for(const [uid,name,dep,dest] of rs)if(name.toLowerCase().includes(ql))routes.push({uid,name,dep,dest,city:c});
    for(const s of ss){
      const n=zh(s.StopName),p=pos(s.StopPosition);stops.add(n);
      if(p){const a=stopPosByName[n]=stopPosByName[n]||[];if(!a.some(x=>x[0]===p[0]&&x[1]===p[1]))a.push(p)}
    }
  }));
  if(!isDemo()&&backfillStops(stopPosByName))store.set("bus_favs",favs);
  const seen=new Set();
  S.results={
    routes:routes.filter(r=>!seen.has(r.uid)&&seen.add(r.uid)).sort((a,b)=>a.name.length-b.name.length||a.name.localeCompare(b.name,"zh-Hant",{numeric:true})).slice(0,30),
    stops:[...stops].sort((a,b)=>a.length-b.length||a.localeCompare(b,"zh-Hant")).slice(0,30)
  };
}

];

/* 常用分組：每個收藏可標「上班」或「回家」。打開看板時依時段預設分頁（12 點前上班、16 點後回家），
   該分組沒有項目就顯示全部。手動切換的分頁在這次開啟期間保留。 */
const GROUPS=[["work","上班"],["home","回家"]];
const hasGroups=()=>shownFavs().some(f=>f.group);
function autoTab(){
  const h=new Date().getHours(),g=h<12?"work":h>=16?"home":null;
  return g&&shownFavs().some(f=>f.group===g)?g:"all";
}
const homeTab=()=>hasGroups()?(S.homeTab||autoTab()):"all";
const homeFavs=()=>{const t=homeTab();return t==="all"?shownFavs():shownFavs().filter(f=>f.group===t)};
function setGroup(id,g){
  const f=favs.find(x=>favId(x)===id);if(!f)return;
  if(g)f.group=g;else delete f.group;
  store.set("bus_favs",favs);
}
const isFav=id=>favs.some(f=>favId(f)===id);
function toggleFav(f){
  const id=favId(f);
  favs=isFav(id)?favs.filter(x=>favId(x)!==id):favs.concat([f]);
  store.set("bus_favs",favs);
}
/* 舊收藏補座標：2026-11-17 之前收藏的項目沒有存位置，常用頁地圖上看不到。
   用已經拿到的資料補上（路線站序、搜尋或附近站牌帶回的站牌座標），不另外呼叫 API。 */
const samePos=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function backfillStops(byName){
  let n=0;
  for(const f of favs){
    if(f.type!=="st"||!byName[f.name])continue;
    const a=f.pos=f.pos||[];
    for(const p of byName[f.name])if(!a.some(x=>samePos(x,p))){a.push(p);n++}
  }
  return n;
}
function backfillFromRoute(city,name,byDir){
  let n=0;const byName={};
  for(const d in byDir)for(const s of byDir[d].Stops)if(s.pos){
    const k=zh(s.StopName),a=byName[k]=byName[k]||[];if(!a.some(x=>samePos(x,s.pos)))a.push(s.pos);
  }
  for(const f of favs){
    if(f.type!=="rs"||f.pos||f.city!==city||f.route!==name)continue;
    const s=byDir[f.dir]&&byDir[f.dir].Stops.find(x=>x.StopUID===f.stopUID);
    if(s&&s.pos){f.pos=s.pos;n++}
  }
  n+=backfillStops(byName);
  if(n)store.set("bus_favs",favs);
  return n;
}
/* 啟動時先用快取裡的站序補（7 天內開過的路線），完全不花額度 */
function backfillFromCache(){
  const done=new Set();
  for(const f of favs){
    if(f.type!=="rs"||f.pos)continue;
    const k=f.city+"|"+f.route;if(done.has(k))continue;done.add(k);
    const byDir=cacheGet("sor2|"+k,7*DAY);
    if(byDir)backfillFromRoute(f.city,f.route,byDir);
  }
}

/* ---------- 更新循環 ---------- */
let seq=0;
async function refresh(){
  const my=++seq,stale=()=>my!==seq;S.busy=true;S.left=REFRESH;
  try{
    if(S.view==="home")await loadHome(stale);
    else if(S.view==="route")await loadRouteLive(stale);
    else if(S.view==="stop")await loadStop(stale);
    if(my!==seq)return;
    S.err="";S.updated=new Date();
  }catch(e){if(my!==seq)return;S.err=errText(e)}
  S.busy=false;render();
  const bg=()=>stale();bg.quiet=true;
  if(S.view==="route"&&S.stops&&!S.shape&&!S.err)
    loadShape(bg).then(()=>{if(!stale())drawMap()}).catch(e=>{if(e!==STALE&&!stale()){S.shape={};drawMap()}});
}
const live=()=>S.view==="home"||S.view==="route"||S.view==="stop";
setInterval(()=>{
  const wt=$("wait");if(wt)wt.textContent=waitUntil>Date.now()?"等待 TDX 配額 "+Math.ceil((waitUntil-Date.now())/1000)+" 秒":"";
  if(document.hidden||!live()||S.busy)return;
  S.left--;
  const bar=$("prog");if(bar)bar.style.width=Math.max(0,S.left/REFRESH*100)+"%";
  if(S.left<=0)refresh();
},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&live())refresh()});
addEventListener("online",()=>{if(live())refresh()});
/* ---------- 網址與瀏覽紀錄 ----------
   每個畫面對應一個 hash：#home、#search、#settings、#route/{City}/{路線}/{方向}、#stop/{站名}。
   換頁時寫入瀏覽紀錄，手機返回手勢與瀏覽器上一頁會回到前一個畫面；路線頁也能加入書籤。 */
function toHash(){
  const e=encodeURIComponent;
  if(S.view==="route")return "#route/"+e(S.route.city)+"/"+e(S.route.name)+"/"+S.dir;
  if(S.view==="stop")return "#stop/"+e(S.stopName);
  return "#"+S.view;
}
function fromHash(h){
  let p;try{p=String(h||"").replace(/^#\/?/,"").split("/").map(decodeURIComponent)}catch(e){p=[]}
  if(p[0]==="route"&&CITY_NAME[p[1]]&&p[2])
    return ["route",{route:{city:p[1],name:p[2]},dir:Number(p[3])||0,stops:null,shape:null,pick:null,eta:{},near:{},updated:null}];
  if(p[0]==="stop"&&p[1]){
    const f=favs.find(x=>x.type==="st"&&x.name===p[1]);
    return ["stop",{stopName:p[1],stopPos:stopPosByName[p[1]]||(f&&f.pos)||[],board:null,updated:null}];
  }
  if(p[0]==="search"||p[0]==="settings")return [p[0],{}];
  return ["home",{}];
}
let depth=0;   // 這次開啟後在看板內前進了幾頁；0 表示返回鍵會離開看板
addEventListener("popstate",ev=>{
  depth=ev.state&&ev.state.nextstop||0;
  const [v,p]=fromHash(location.hash);
  if(!p.prev)p.prev="home";
  go(v,p,{push:false});
  if(toHash()!==location.hash)history.replaceState({nextstop:depth},"",toHash());   // 無效網址改正為實際畫面
});
function go(view,patch,opt){
  Object.assign(S,{view,err:"",msg:""},patch||{});
  if(!opt||opt.push!==false){
    const h=toHash();
    if(h!==location.hash){depth++;history.pushState({nextstop:depth},"",h)}
  }
  if(view==="search"||view==="settings")setSheet("full");
  else if(S.sheet==="full")setSheet("half");
  render();$("main").scrollTop=0;
  if(live())refresh();
}

    const on=S.view===v||(v==="search"&&(S.view==="route"||S.view==="stop"));

  }
  let title="雙北公車即時看板",sub="",back=false;

    if(s){
      const ss=S.stops[S.dir].Stops,tw=zh(ss[ss.length-1].StopName),e=S.eta[S.dir+"|"+s.StopUID];
      h+=tripCard({tag:"button",cls:"pickline",hot:true,e,attrs:'data-act="topick" data-uid="'+esc(s.StopUID)+'"',
        label:"捲到 "+zh(s.StopName),head:'<span class="k">選取的站 · 往 '+esc(tw)+'</span><b class="to" style="font-size:17px;color:inherit;font-weight:600">'+esc(zh(s.StopName))+"</b>"});
    }
  }
  if(live())h+='<div class="meta"><span>'+(S.updated?"更新於 "+hm(S.updated)+":"+p2(S.updated.getSeconds()):"載入中")+
    '</span><span id="wait" style="color:var(--soon)"></span><span>每 '+REFRESH+' 秒自動更新</span></div><div class="prog"><i id="prog" style="width:'+(S.left/REFRESH*100)+'%"></i></div>';
  $("head").innerHTML=h;
  let m="";
  if(isDemo()&&S.view!=="settings")m+='<div class="demo">目前顯示的是示範資料，不是真實到站時間。<button data-act="tab" data-v="settings">填入 TDX 金鑰</button>後才會連線。</div>';
  const used=usage().n;
  if(!isDemo()&&used>=MONTH_FREE*0.8)m+='<div class="demo">本月這台裝置已呼叫 TDX '+used+' 次，接近免費額度（約 '+MONTH_FREE.toLocaleString()+' 次）。用量超過 105% 時，TDX 會停用帳號到月底。</div>';
  if(S.err)m+='<div class="err" role="alert">'+esc(S.err)+"</div>";
  m+=({home:vHome,search:vSearch,route:vRoute,stop:vStop,settings:vSettings})[S.view]();
  $("main").innerHTML=m;
  drawMap();
  if(S.scrollPick&&S.view==="route"&&S.stops){
    const row=document.querySelector('[data-act="pick"][data-uid="'+CSS.escape(S.scrollPick)+'"]');
    S.scrollPick=null;if(row)row.scrollIntoView({block:"center"});
  }
}

document.addEventListener("click",async ev=>{
  if(dragEnded)return;
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="tab")go(el.dataset.v);
  else if(a==="back"){if(depth>0)history.back();else go(S.prev||"search")}
  else if(a==="route"){
    const prev=S.view==="route"?S.prev:S.view;
    const rk=el.dataset.city+"|"+el.dataset.name;
    go("route",{route:{city:el.dataset.city,name:el.dataset.name},dir:el.dataset.dir!=null?Number(el.dataset.dir):(store.get("route_dir",{})[rk]||0),stops:null,shape:null,pick:el.dataset.uid||null,scrollPick:el.dataset.uid||null,eta:{},near:{},prev,updated:null});
  }
  else if(a==="stop"){
    const name=el.dataset.name,p=el.dataset.pos?JSON.parse(el.dataset.pos):(stopPosByName[name]||[]);
    go("stop",{stopName:name,stopPos:p,board:null,prev:S.view==="stop"?S.prev:S.view,updated:null});
  }
  else if(a==="pick")pickStop(el.dataset.uid,"list");
  else if(a==="hometab"){S.homeTab=el.dataset.t;render()}
  else if(a==="editfav"){S.editFav=!S.editFav;render()}
  else if(a==="group"){setGroup(el.dataset.id,el.dataset.g);render()}
  else if(a==="unfav"){favs=favs.filter(x=>favId(x)!==el.dataset.id);store.set("bus_favs",favs);if(!favs.length)S.editFav=false;render();if(live())refresh()}
  else if(a==="topick"){
    if(!WIDE.matches&&S.sheet==="peek")setSheet("half");
    const row=document.querySelector('[data-act="pick"][data-uid="'+CSS.escape(el.dataset.uid)+'"]');
    if(row){row.scrollIntoView({block:"center",behavior:CALM.matches?"auto":"smooth"});row.focus({preventScroll:true})}
  }
  else if(a==="nearby")findNearby();
  else if(a==="sheet")cycleSheet();
  else if(a==="dir"){
    S.dir=Number(el.dataset.d);S.pick=null;history.replaceState({nextstop:depth},"",toHash());
    /* 記住這條路線上次看的方向；從搜尋結果進來時沿用（從收藏或站牌看板進來時，用該項目本身的方向） */
    const m=store.get("route_dir",{});m[S.route.city+"|"+S.route.name]=S.dir;store.set("route_dir",m);
    render();
  }
  else if(a==="fav"){toggleFav(JSON.parse(el.dataset.f));render()}
  else if(a==="search"||a==="save")doAction(a);
  else if(a==="clear"){cred=null;store.del("tdx_cred");store.del("tdx_tok");S.msg="已清除金鑰，回到示範資料。";S.msgOk=true;render()}
});
document.addEventListener("keydown",ev=>{
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset&&ev.target.dataset.act==="pick"){ev.preventDefault();pickStop(ev.target.dataset.uid,"list");return}
  if(ev.key!=="Enter"||ev.isComposing)return;

async function doAction(kind){

/* ---------- 地圖 ---------- */
/* 底圖：內政部國土測繪中心「臺灣通用電子地圖」WMTS，免金鑰；深色模式用 CSS 反相。
   地圖不另外呼叫 TDX 抓 GPS：公車畫在 RealTimeNearStop 回報的站牌位置上，精度到「站」，不增加每輪更新的呼叫次數。 */
const WIDE=matchMedia("(min-width:1024px)"),DARK=matchMedia("(prefers-color-scheme:dark)"),CALM=matchMedia("(prefers-reduced-motion:reduce)");
let map=null,lay=null,meLayer=null,fitKey="",me=null;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function initMap(){
  if(!window.L){document.documentElement.classList.add("nomap");return}
  map=L.map("map",{zoomControl:false,attributionControl:false}).setView([25.04,121.52],12);
  /* crossOrigin：圖磚以 CORS 取得，service worker 才能存成一般回應（opaque 回應會被瀏覽器灌水計入儲存空間） */
  L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP01/default/GoogleMapsCompatible/{z}/{y}/{x}",{maxZoom:19,crossOrigin:"anonymous",
    attribution:'<a href="https://maps.nlsc.gov.tw/" target="_blank" rel="noopener">內政部國土測繪中心</a>'}).addTo(map);
  L.control.zoom({position:"topright"}).addTo(map);
  const Loc=L.Control.extend({onAdd(){
    const d=L.DomUtil.create("div","leaflet-bar");
    d.innerHTML='<button type="button" class="locate" id="locate" aria-label="顯示我的位置">◎</button>';
    L.DomEvent.disableClickPropagation(d);
    d.firstChild.addEventListener("click",()=>locate().then(onLocated).catch(locErr));
    return d;
  }});
  new Loc({position:"topright"}).addTo(map);
  meLayer=L.layerGroup().addTo(map);
  /* 版權標示：手機放左上（下方被抽屜蓋住），桌面放右下（左上被面板蓋住） */
  const attr=L.control.attribution({prefix:'<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>'}).addTo(map);
  const place=()=>attr.setPosition(WIDE.matches?"bottomright":"topleft");place();WIDE.addEventListener("change",place);
  lay=L.layerGroup().addTo(map);
  const dark=()=>$("map").classList.toggle("map-dark",DARK.matches);dark();DARK.addEventListener("change",()=>{dark();render()});
  WIDE.addEventListener("change",()=>{fitKey="";map.invalidateSize();drawMap()});
}
/* ---------- 定位 ----------
   位置只在這台裝置使用：畫在地圖上、找路線上最近的站。只有按「附近的站牌」時，才會把座標放進查詢送給 TDX。 */
const dist=(a,b)=>{const r=Math.PI/180,x=(b[1]-a[1])*r*Math.cos((a[0]+b[0])/2*r),y=(b[0]-a[0])*r;return Math.round(Math.sqrt(x*x+y*y)*6371e3)};
function locate(){
  return new Promise((ok,no)=>{
    if(!navigator.geolocation)return no(new Error("unsupported"));
    const b=$("locate");if(b)b.setAttribute("aria-busy","true");
    navigator.geolocation.getCurrentPosition(p=>{if(b)b.removeAttribute("aria-busy");
      me={pos:[p.coords.latitude,p.coords.longitude],acc:p.coords.accuracy};drawMe();ok(me)},
      e=>{if(b)b.removeAttribute("aria-busy");no(e)},{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  });
}
function locErr(e){
  S.err=e&&e.code===1?"沒有定位權限。請到瀏覽器或手機設定允許這個網站使用位置。":e&&e.message==="unsupported"?"這個瀏覽器不支援定位。":"無法取得位置，請稍後再試。";
  render();
}
function drawMe(){
  if(!map||!me)return;
  meLayer.clearLayers();
  if(me.acc<1000)L.circle(me.pos,{radius:me.acc,weight:0,fillColor:"#2a7bf6",fillOpacity:.12,interactive:false}).addTo(meLayer);
  L.marker(me.pos,{keyboard:false,interactive:false,icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[0,0]})}).addTo(meLayer);
}
/* 路線頁：選取目前方向上離我最近的站；其他畫面：把地圖移到我的位置 */
function onLocated(){
  if(S.err&&/定位|位置/.test(S.err)){S.err="";render()}
  if(S.view==="route"&&S.stops&&S.stops[S.dir]){
    const pts=S.stops[S.dir].Stops.filter(s=>s.pos);
    if(pts.length){const n=pts.reduce((a,b)=>dist(me.pos,b.pos)<dist(me.pos,a.pos)?b:a);S.pick=null;pickStop(n.StopUID,"map");return}
  }
  const o=pad(),z=Math.max(map.getZoom(),16);
  const pt=map.project(me.pos,z).subtract([((o.paddingTopLeft[0]-o.paddingBottomRight[0])/2),((o.paddingTopLeft[1]-o.paddingBottomRight[1])/2)]);
  map.setView(map.unproject(pt,z),z,{animate:!CALM.matches});
}
/* 搜尋頁「附近的站牌」：以我的位置查 400 公尺內的站牌（台北、新北各 1 次） */
async function findNearby(){
  S.busy=true;S.err="";S.q="";render();
  try{
    const m=await locate();
    const near={};
    await Promise.all(CITIES.map(async([c])=>{
      /* 用標準 OData $filter 圈出約 400 公尺見方，再在本機算實際距離，超過 400 公尺的丟掉 */
      const [la,lo]=m.pos,dy=400/111320,dx=400/(111320*Math.cos(la*Math.PI/180)),f=v=>v.toFixed(5);
      const box="StopPosition/PositionLat ge "+f(la-dy)+" and StopPosition/PositionLat le "+f(la+dy)+
        " and StopPosition/PositionLon ge "+f(lo-dx)+" and StopPosition/PositionLon le "+f(lo+dx);
      const rows=await api("Stop/City/"+c,{"$filter":box,"$select":"StopName,StopPosition","$top":"300"},()=>S.view!=="search");
      for(const r of rows){
        const n=zh(r.StopName),p=pos(r.StopPosition);if(!p)continue;
        const d=dist(m.pos,p);if(d>400)continue;
        if(!near[n]||d<near[n])near[n]=d;
        const a=stopPosByName[n]=stopPosByName[n]||[];if(!a.some(x=>x[0]===p[0]&&x[1]===p[1]))a.push(p);
      }
    }));
    if(!isDemo()&&backfillStops(stopPosByName))store.set("bus_favs",favs);
    S.results={routes:[],stops:Object.keys(near).sort((a,b)=>near[a]-near[b]).slice(0,30),dist:near,nearby:true};
  }catch(e){if(e!==STALE){if(e&&(e.code||e.message==="unsupported"))locErr(e);else S.err=errText(e)}}
  S.busy=false;render();
}
/* 被面板蓋住的區域不算可視範圍 */
function pad(){
  if(WIDE.matches)return {paddingTopLeft:[440,40],paddingBottomRight:[60,40]};
  return {paddingTopLeft:[30,50],paddingBottomRight:[30,$("app").offsetHeight+70]};
}
function fit(key,pts,zoom){
  if(!pts.length||key===fitKey)return;
  fitKey=key;
  if(pts.length===1){map.setView(pts[0],zoom||17,{animate:false});
    const o=pad();map.panBy([((o.paddingTopLeft[0]-o.paddingBottomRight[0])/-2),((o.paddingTopLeft[1]-o.paddingBottomRight[1])/-2)],{animate:false});return}
  map.fitBounds(L.latLngBounds(pts),Object.assign({maxZoom:17,animate:false},pad()));
}
const dot=(p,sel,label,onClick,perm)=>{
  const m=L.circleMarker(p,{radius:sel?9:perm?7:5,weight:2,color:"#fff",fillColor:sel?css("--now"):css("--accent"),fillOpacity:1})
    .bindTooltip(label,{direction:"top",offset:[0,-6],permanent:!!(sel||perm)});
  if(onClick)m.on("click",onClick);
  return m.addTo(lay);
};
function drawMap(){
  if(!map)return;
  lay.clearLayers();drawMe();
  const v=S.view;
  if(v==="route"&&S.stops&&S.stops[S.dir]){
    const cur=S.stops[S.dir],pts=cur.Stops.filter(s=>s.pos);
    const shape=S.shape&&(S.shape[S.dir]||S.shape.any);
    const lines=shape&&shape.length?shape:[pts.map(s=>s.pos)];
    const lc=famColor(S.route.name)||css("--route");
    for(const l of lines)L.polyline(l,{color:lc,weight:6,opacity:.85,interactive:false}).addTo(lay);
    for(const s of pts)dot(s.pos,S.pick===s.StopUID,esc(zh(s.StopName)),()=>pickStop(s.StopUID,"map"));
    for(const s of pts)for(const b of S.near[S.dir+"|"+s.StopUID]||[])
      L.marker(s.pos,{keyboard:false,icon:L.divIcon({className:"bus",html:"<i></i><em>"+esc(b.PlateNumb)+"</em>",iconSize:[0,0]}),zIndexOffset:500}).addTo(lay);
    const sel=pts.find(s=>s.StopUID===S.pick);
    fit("route|"+S.route.city+"|"+S.route.name+"|"+S.dir,sel?[sel.pos]:pts.map(s=>s.pos),16);
  }else if(v==="stop"){
    for(const p of S.stopPos)dot(p,true,esc(S.stopName));
    fit("stop|"+S.stopName,S.stopPos,17);
  }else if(v==="home"){
    /* 同一個位置可能同時是「路線＋站牌」和「站牌看板」，合併成一個點，標籤分行列出，點下去進第一個 */
    const at={};
    for(const f of homeFavs())for(const p of f.type==="rs"?(f.pos?[f.pos]:[]):(f.pos||[])){
      const k=p.join(",");(at[k]=at[k]||{p,fs:[]}).fs.push(f);
    }
    const open=f=>f.type==="rs"
      ?go("route",{route:{city:f.city,name:f.route},dir:f.dir,stops:null,shape:null,pick:f.stopUID,scrollPick:f.stopUID,eta:{},near:{},prev:"home",updated:null})
      :go("stop",{stopName:f.name,stopPos:f.pos||[],board:null,prev:"home",updated:null});
    for(const {p,fs} of Object.values(at))
      dot(p,false,fs.map(f=>esc(f.type==="rs"?f.route+"　"+f.stopName:f.name+"（站牌）")).join("<br>"),()=>open(fs[0]),true);
    fit("home|"+Object.keys(at).length,Object.values(at).map(x=>x.p));
  }
}
/* 列表與地圖同步選取：點列表移動地圖，點地圖上的站讓列表捲到該站 */
function pickStop(uid,from){
  S.pick=S.pick===uid&&from==="list"?null:uid;
  const cur=S.stops&&S.stops[S.dir],s=cur&&cur.Stops.find(x=>x.StopUID===uid);
  render();
  if(map&&s&&s.pos&&S.pick){
    if(!WIDE.matches&&S.sheet==="full")setSheet("half");
    const o=pad(),z=Math.max(map.getZoom(),15);
    const pt=map.project(s.pos,z).subtract([((o.paddingTopLeft[0]-o.paddingBottomRight[0])/2),((o.paddingTopLeft[1]-o.paddingBottomRight[1])/2)]);
    map.setView(map.unproject(pt,z),z,{animate:!CALM.matches});
  }
  if(from==="map"){
    if(!WIDE.matches&&S.sheet==="peek")setSheet("half");
    const row=document.querySelector('[data-act="pick"][data-uid="'+CSS.escape(uid)+'"]');
    if(row)row.scrollIntoView({block:"center",behavior:CALM.matches?"auto":"smooth"});
  }
}

/* ---------- 手機抽屜 ---------- */
/* 三段高度：peek 只露出標題列、half 約半個畫面、full 幾乎滿版。把手可點按循環，標題列與把手可拖曳。 */
const SHEETS=["peek","half","full"];
let dragEnded=false;   // 拖曳結束時瀏覽器會補一次 click，這段時間內忽略
function sheetPx(k){
  const vh=innerHeight,nav=document.querySelector("nav").offsetHeight;
  if(k==="peek")return 22+$("head").offsetHeight;
  if(k==="full")return vh-nav-56;
  return Math.round(vh*0.52);
}
function setSheet(k){
  S.sheet=k;
  if(WIDE.matches){$("app").style.removeProperty("--sheet");return}
  $("app").style.setProperty("--sheet",sheetPx(k)+"px");
  $("grip").setAttribute("aria-label","調整列表高度（目前："+({peek:"收起",half:"一半",full:"展開"})[k]+"）");
  if(map)setTimeout(()=>map.invalidateSize(),260);
}
function cycleSheet(){setSheet(SHEETS[(SHEETS.indexOf(S.sheet)+1)%3])}
(function(){
  let y0=0,h0=0,moved=false,on=false;
  const app=$("app");
  app.addEventListener("pointerdown",ev=>{
    if(WIDE.matches||!ev.target.closest(".grip,header")||ev.target.closest("header button"))return;
    on=true;moved=false;y0=ev.clientY;h0=app.offsetHeight;app.classList.add("dragging");
  });
  addEventListener("pointermove",ev=>{
    if(!on)return;const dy=ev.clientY-y0;if(Math.abs(dy)>6)moved=true;
    if(moved)app.style.setProperty("--sheet",Math.max(sheetPx("peek"),Math.min(sheetPx("full"),h0-dy))+"px");
  });
  addEventListener("pointerup",ev=>{
    if(!on)return;on=false;app.classList.remove("dragging");
    if(!moved)return;
    const h=app.offsetHeight;let best="half";
    for(const k of SHEETS)if(Math.abs(sheetPx(k)-h)<Math.abs(sheetPx(best)-h))best=k;
    setSheet(best);
    dragEnded=true;setTimeout(()=>{dragEnded=false},80);
  });
})();
addEventListener("resize",()=>{if(!WIDE.matches)setSheet(S.sheet)});

/* ---------- 示範資料（未填金鑰時使用） ---------- */
const DEMO={
  0:["板橋","捷運龍山寺站","和平醫院","捷運西門站","捷運台北車站","南京建國路口","南京敦化路口","撫遠街"],
  1:["撫遠街","南京三民路口","南京敦化路口","南京建國路口","捷運台北車站","捷運西門站","捷運龍山寺站","板橋"]
};
/* 示範站牌的大約座標（只為了畫示範地圖，不是 TDX 資料） */
const DEMO_POS={"板橋":[25.0143,121.4637],"捷運龍山寺站":[25.0353,121.4999],"和平醫院":[25.0359,121.5059],"捷運西門站":[25.0421,121.5081],
  "捷運台北車站":[25.0461,121.5174],"南京建國路口":[25.0521,121.5371],"南京敦化路口":[25.0519,121.5489],"南京三民路口":[25.0517,121.5619],"撫遠街":[25.0527,121.5651]};
const demoPos=n=>({PositionLat:DEMO_POS[n][0],PositionLon:DEMO_POS[n][1]});
function demoApi(path,p){
  const now=Math.floor(Date.now()/1000),f=p["$filter"]||"";
  const route={RouteUID:"DEMO307",RouteName:{Zh_tw:"307"},DepartureStopNameZh:"板橋",DestinationStopNameZh:"撫遠街"};
  const m=/contains\([^,]+,'(.*)'\)/.exec(f),kw=m?m[1]:"";
  if(path.startsWith("Route/"))return path.endsWith("/Taipei")&&(!m||"307".includes(kw))?[route]:[];
  if(path.startsWith("Stop/"))return path.endsWith("/Taipei")?[...new Set(DEMO[0].concat(DEMO[1]))].filter(n=>n.includes(kw)).map(n=>({StopName:{Zh_tw:n},StopPosition:demoPos(n)})):[];
  if(!path.includes("/Taipei"))return [];
  const stops=d=>DEMO[d].map((n,i)=>({StopUID:"D"+d+"-"+i,StopName:{Zh_tw:n},StopSequence:i+1,StopPosition:demoPos(n)}));
  if(path.startsWith("StopOfRoute/"))return [0,1].map(d=>({RouteUID:"DEMO307",RouteName:{Zh_tw:"307"},Direction:d,Stops:stops(d)}));
  const pos=d=>Math.floor(now/45+d*3)%8,sec=45-now%45;
  if(path.startsWith("RealTimeNearStop/"))return [0,1].map(d=>({PlateNumb:d?"EAL-0372":"EAL-0158",Direction:d,StopUID:"D"+d+"-"+pos(d),A2EventType:sec>20?1:0}));
  const sm=/StopName\/Zh_tw eq '(.*)'/.exec(f),out=[];
  for(const d of [0,1])stops(d).forEach((s,i)=>{
    if(sm&&s.StopName.Zh_tw!==sm[1])return;
    const gap=(i-pos(d)+8)%8,last=i===7;
    out.push(Object.assign({RouteUID:"DEMO307",RouteName:{Zh_tw:"307"},Direction:d},s,
      d===1&&i===0?{StopStatus:1,EstimateTime:null}:d===1&&i===1?{StopStatus:1,EstimateTime:720}:{StopStatus:0,EstimateTime:gap===0?sec:gap*110+sec,IsLastBus:last&&d===0}));
  });
  return out;
}

/* PWA：加入主畫面後可離線開啟介面。只在 https 或 localhost 註冊 */
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1"))
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(!isDemo())backfillFromCache();
initMap();setSheet(S.sheet);
(function(){
  const [v,p]=fromHash(location.hash);   // 無效的 hash 會落回首頁，網址也一併改正
  if(v!=="home")p.prev="home";
  go(v,p,{push:false});
  history.replaceState({nextstop:0},"",location.pathname+location.search+toHash());
})();
</script>
</body>
</html>
